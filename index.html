<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quarto 3D — Entardecer na Costa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0b10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: #f4eee6;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 45%, #231922 0%, #0d0b11 100%);
      transition: opacity 0.65s ease, visibility 0.65s ease;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid rgba(255, 200, 145, 0.18);
      border-top-color: #f3a86b;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(244, 232, 218, 0.78);
    }

    .hud-top {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .title-badge {
      pointer-events: auto;
      background: rgba(14, 12, 18, 0.54);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 218, 180, 0.14);
      border-radius: 14px;
      padding: 10px 15px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }
    .title-badge h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #f9efe2;
    }
    .title-badge span {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: rgba(242, 220, 196, 0.68);
    }

    .hud-actions {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      background: rgba(14, 12, 18, 0.54);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 218, 180, 0.15);
      color: #f5ebe0;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .icon-btn:hover {
      background: rgba(34, 28, 38, 0.78);
      border-color: rgba(248, 185, 128, 0.4);
    }
    .icon-btn:active { transform: scale(0.96); }

    .hud-bottom {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 5px;
      max-width: calc(100vw - 20px);
      padding: 6px 9px;
      background: rgba(14, 12, 18, 0.56);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 218, 180, 0.14);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .cam-btn {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(245, 232, 218, 0.82);
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.22s ease;
      white-space: nowrap;
    }
    .cam-btn:hover {
      color: #fff;
      background: rgba(255, 206, 160, 0.11);
    }
    .cam-btn.active {
      color: #181218;
      background: linear-gradient(135deg, #f7bd85, #e68c57);
      border-color: rgba(255, 236, 214, 0.5);
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(235, 140, 82, 0.35);
    }
    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 218, 180, 0.16);
      margin: 0 2px;
    }
    .sun-control {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 6px;
      font-size: 11px;
      color: rgba(244, 224, 202, 0.78);
    }
    .sun-control input[type="range"] {
      width: 78px;
      accent-color: #ef9c61;
      cursor: pointer;
    }

    body.ui-hidden .hud-top .title-badge,
    body.ui-hidden .hud-bottom {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(14px);
    }
    body.ui-hidden .hud-top .title-badge {
      transform: translateY(-10px);
    }

    .cam-btns { display: contents; }

    @media (max-width: 640px) {
      .title-badge { padding: 8px 11px; }
      .title-badge h1 { font-size: 12.5px; }
      .title-badge span { font-size: 10px; }
      .hud-bottom {
        flex-wrap: nowrap;
        justify-content: flex-start;
        left: 8px;
        right: 8px;
        width: auto;
        max-width: none;
        transform: none;
        bottom: calc(8px + env(safe-area-inset-bottom));
        padding: 5px;
        gap: 4px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
      }
      .hud-bottom::-webkit-scrollbar { display: none; }
      .cam-btn { padding: 8px 11px; font-size: 11.5px; flex: 0 0 auto; scroll-snap-align: start; }
      .divider { display: block; flex: 0 0 1px; }
      .sun-control { flex: 0 0 auto; padding: 0 8px; gap: 8px; font-size: 11.5px; scroll-snap-align: end; }
      .sun-control span { white-space: nowrap; }
      .sun-control input[type="range"] { width: 150px; height: 28px; touch-action: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <p>Preparando cena 3D...</p>
  </div>

  <div id="canvas-container"></div>

  <div class="hud-top">
    <div class="title-badge">
      <h1>Entardecer na Costa</h1>
      <span>Arraste para girar · Pinça ou scroll para aproximar</span>
    </div>
    <div class="hud-actions">
      <button id="btn-pause" class="icon-btn" title="Pausar/Retomar animações">Pausar</button>
      <button id="btn-ui" class="icon-btn" title="Ocultar/Mostrar interface">Limpar tela</button>
    </div>
  </div>

  <div class="hud-bottom" id="camera-bar">
    <div class="cam-btns">
    <button class="cam-btn active" data-cam="overview">Visão Geral</button>
    <button class="cam-btn" data-cam="girl">Ela (360°)</button>
    <button class="cam-btn" data-cam="coffee">Xícara de Café</button>
    <button class="cam-btn" data-cam="window">Vista da Janela</button>
    <button class="cam-btn" data-cam="room">Interior do Quarto</button>
    </div>
    <div class="divider"></div>
    <label class="sun-control" title="Altura do pôr do sol">
      <span>Pôr do sol</span>
      <input id="sun-slider" type="range" min="0" max="100" value="44" />
    </label>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    RectAreaLightUniformsLib.init();

    // =========================================================================
    // 1. UTILITÁRIOS DE RUÍDO E GERADOR PBR COM NORMAL MAPS REAIS (SOBEL)
    // =========================================================================
    function hash2(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }

    function valueNoise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, octaves = 5) {
      let v = 0.0, amp = 0.5, freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        v += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return v;
    }

    function ridged2D(x, y, octaves = 5) {
      let v = 0.0, amp = 0.52, freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        let n = valueNoise2D(x * freq, y * freq);
        n = 1.0 - Math.abs(n * 2.0 - 1.0);
        n = n * n;
        v += amp * n;
        freq *= 2.1;
        amp *= 0.48;
      }
      return v;
    }

    function makeCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      return c;
    }

    // Converte um canvas de mapa de altura em NormalMap real tangente (filtro Sobel)
    function heightCanvasToNormalTexture(heightCanvas, strength = 2.4, repeatX = 1, repeatY = 1) {
      const w = heightCanvas.width;
      const h = heightCanvas.height;
      const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
      const outC = makeCanvas(w, h);
      const outCtx = outC.getContext('2d');
      const outImg = outCtx.createImageData(w, h);
      const dst = outImg.data;

      const sample = (x, y) => {
        const wx = ((x % w) + w) % w;
        const wy = ((y % h) + h) % h;
        return src[(wy * w + wx) * 4] / 255.0;
      };

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const tl = sample(x - 1, y - 1);
          const t  = sample(x,     y - 1);
          const tr = sample(x + 1, y - 1);
          const l  = sample(x - 1, y);
          const r  = sample(x + 1, y);
          const bl = sample(x - 1, y + 1);
          const b  = sample(x,     y + 1);
          const br = sample(x + 1, y + 1);

          const dx = (tr + 2.0 * r + br) - (tl + 2.0 * l + bl);
          const dy = (bl + 2.0 * b + br) - (tl + 2.0 * t + tr);
          let nx = -dx * strength;
          let ny = -dy * strength;
          let nz = 1.0;
          const invLen = 1.0 / Math.sqrt(nx * nx + ny * ny + nz * nz);
          nx *= invLen; ny *= invLen; nz *= invLen;

          const idx = (y * w + x) * 4;
          dst[idx]     = Math.round((nx * 0.5 + 0.5) * 255);
          dst[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
          dst[idx + 2] = Math.round((nz * 0.5 + 0.5) * 255);
          dst[idx + 3] = 255;
        }
      }
      outCtx.putImageData(outImg, 0, 0);
      const tex = new THREE.CanvasTexture(outC);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.anisotropy = 8;
      return tex;
    }

    // Textura radial macia para sombras de contato (AO real sob móveis e objetos)
    const contactShadowTex = (() => {
      const size = 256;
      const c = makeCanvas(size, size);
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, size * 0.04, size / 2, size / 2, size * 0.5);
      g.addColorStop(0.0, 'rgba(12, 7, 4, 0.72)');
      g.addColorStop(0.45, 'rgba(14, 8, 5, 0.42)');
      g.addColorStop(0.78, 'rgba(16, 10, 6, 0.12)');
      g.addColorStop(1.0, 'rgba(16, 10, 6, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(c);
      return tex;
    })();

    function createContactShadow(rx, rz, opacity = 0.55) {
      const mat = new THREE.MeshBasicMaterial({
        map: contactShadowTex,
        transparent: true,
        opacity,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(rx * 2, rz * 2), mat);
      mesh.rotation.x = -Math.PI / 2;
      return mesh;
    }

    // Piso de tábuas de carvalho/nogueira com nós, veios ricos, normalMap e roughnessMap
    function createWoodFloorTextures() {
      const size = 1024;
      const colC = makeCanvas(size, size);
      const hC = makeCanvas(size, size);
      const rC = makeCanvas(size, size);
      const cCtx = colC.getContext('2d');
      const hCtx = hC.getContext('2d');
      const rCtx = rC.getContext('2d');

      const planks = 8;
      const plankW = size / planks;

      hCtx.fillStyle = '#909090';
      hCtx.fillRect(0, 0, size, size);
      rCtx.fillStyle = '#8a8a8a';
      rCtx.fillRect(0, 0, size, size);

      for (let p = 0; p < planks; p++) {
        const px = p * plankW;
        const toneShift = (hash2(p, 11.3) - 0.5) * 28;
        const baseR = Math.round(122 + toneShift);
        const baseG = Math.round(82 + toneShift * 0.72);
        const baseB = Math.round(52 + toneShift * 0.48);

        cCtx.fillStyle = `rgb(${baseR},${baseG},${baseB})`;
        cCtx.fillRect(px, 0, plankW, size);

        const jointY = Math.floor(hash2(p, 4.7) * size);
        const rVal = Math.round(115 + (hash2(p, 71.1) - 0.5) * 42);
        rCtx.fillStyle = `rgb(${rVal},${rVal},${rVal})`;
        rCtx.fillRect(px + 2, 0, plankW - 4, size);

        // Veios e fibras finas
        for (let i = 0; i < 120; i++) {
          const xOff = px + hash2(p * 37 + i, 2.1) * plankW;
          const alpha = 0.05 + hash2(i, p * 9.2) * 0.13;
          const dark = hash2(i + 5, p + 3) > 0.38;
          cCtx.strokeStyle = dark ? `rgba(38, 20, 10, ${alpha})` : `rgba(184, 138, 92, ${alpha * 0.7})`;
          cCtx.lineWidth = 0.7 + hash2(i, p) * 2.2;
          cCtx.beginPath();
          cCtx.moveTo(xOff, 0);
          for (let y = 0; y <= size; y += 48) {
            const wave = Math.sin(y * 0.012 + i * 0.7 + p) * 4.5 + Math.cos(y * 0.025 + i) * 1.4;
            cCtx.lineTo(Math.max(px + 2, Math.min(px + plankW - 2, xOff + wave)), y);
          }
          cCtx.stroke();

          hCtx.strokeStyle = dark ? `rgba(110,110,110,${alpha * 1.4})` : `rgba(168,168,168,${alpha * 1.1})`;
          hCtx.lineWidth = 1.2;
          hCtx.beginPath();
          hCtx.moveTo(xOff, 0);
          for (let y = 0; y <= size; y += 48) {
            const wave = Math.sin(y * 0.012 + i * 0.7 + p) * 4.5 + Math.cos(y * 0.025 + i) * 1.4;
            hCtx.lineTo(Math.max(px + 2, Math.min(px + plankW - 2, xOff + wave)), y);
          }
          hCtx.stroke();
        }

        // Pequeno nó natural de madeira em algumas tábuas
        if (hash2(p, 19.4) > 0.45) {
          const kx = px + (0.25 + hash2(p, 3.3) * 0.5) * plankW;
          const ky = (0.15 + hash2(p, 8.8) * 0.7) * size;
          const kg = cCtx.createRadialGradient(kx, ky, 1, kx, ky, 12);
          kg.addColorStop(0, 'rgba(34, 18, 9, 0.62)');
          kg.addColorStop(0.6, 'rgba(54, 30, 15, 0.25)');
          kg.addColorStop(1, 'rgba(54, 30, 15, 0.0)');
          cCtx.fillStyle = kg;
          cCtx.save();
          cCtx.translate(kx, ky);
          cCtx.scale(0.65, 1.9);
          cCtx.beginPath();
          cCtx.arc(0, 0, 12, 0, Math.PI * 2);
          cCtx.fill();
          cCtx.restore();
        }

        // Chanfro/friso entre tábuas
        cCtx.fillStyle = 'rgba(20, 10, 5, 0.80)';
        cCtx.fillRect(px, 0, 2.8, size);
        cCtx.fillRect(px, jointY, plankW, 2.4);

        hCtx.fillStyle = '#181818';
        hCtx.fillRect(px, 0, 3.6, size);
        hCtx.fillRect(px, jointY, plankW, 3.0);

        rCtx.fillStyle = '#ececec';
        rCtx.fillRect(px, 0, 3.6, size);
        rCtx.fillRect(px, jointY, plankW, 3.0);
      }

      const map = new THREE.CanvasTexture(colC);
      const normalMap = heightCanvasToNormalTexture(hC, 2.6, 3.2, 3.2);
      const roughnessMap = new THREE.CanvasTexture(rC);
      map.colorSpace = THREE.SRGBColorSpace;
      for (const t of [map, roughnessMap]) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3.2, 3.2);
        t.anisotropy = 8;
      }
      return { map, normalMap, roughnessMap };
    }

    // Madeira nogueira PBR completa (albedo + normalMap + roughnessMap)
    function createWalnutPBR(baseHex = '#563622', grainHex = '#241209', repeat = 1) {
      const w = 512, h = 512;
      const colC = makeCanvas(w, h);
      const hC = makeCanvas(w, h);
      const rC = makeCanvas(w, h);
      const cCtx = colC.getContext('2d');
      const hCtx = hC.getContext('2d');
      const rCtx = rC.getContext('2d');

      cCtx.fillStyle = baseHex;
      cCtx.fillRect(0, 0, w, h);
      hCtx.fillStyle = '#808080';
      hCtx.fillRect(0, 0, w, h);
      rCtx.fillStyle = '#989898';
      rCtx.fillRect(0, 0, w, h);

      for (let i = 0; i < 210; i++) {
        const y = hash2(i, 3.1) * h;
        const alpha = 0.08 + hash2(i, 9.7) * 0.19;
        const lw = 0.7 + hash2(i, 1.4) * 3.0;
        const isLight = hash2(i, 14.2) > 0.78;
        cCtx.strokeStyle = isLight ? `rgba(165, 118, 76, ${alpha * 0.65})` : grainHex;
        cCtx.globalAlpha = isLight ? 1 : alpha;
        cCtx.lineWidth = lw;
        cCtx.beginPath();
        cCtx.moveTo(0, y);
        for (let x = 0; x <= w; x += 24) {
          const dy = Math.sin(x * 0.015 + i * 0.5) * 6.5 + Math.cos(x * 0.036 + i) * 2.2;
          cCtx.lineTo(x, y + dy);
        }
        cCtx.stroke();

        hCtx.strokeStyle = isLight ? `rgba(162,162,162,${alpha})` : `rgba(88,88,88,${alpha * 1.3})`;
        hCtx.lineWidth = lw * 0.8;
        hCtx.beginPath();
        hCtx.moveTo(0, y);
        for (let x = 0; x <= w; x += 24) {
          const dy = Math.sin(x * 0.015 + i * 0.5) * 6.5 + Math.cos(x * 0.036 + i) * 2.2;
          hCtx.lineTo(x, y + dy);
        }
        hCtx.stroke();

        rCtx.strokeStyle = isLight ? `rgba(128,128,128,${alpha})` : `rgba(182,182,182,${alpha})`;
        rCtx.lineWidth = lw;
        rCtx.beginPath();
        rCtx.moveTo(0, y);
        for (let x = 0; x <= w; x += 24) {
          const dy = Math.sin(x * 0.015 + i * 0.5) * 6.5 + Math.cos(x * 0.036 + i) * 2.2;
          rCtx.lineTo(x, y + dy);
        }
        rCtx.stroke();
      }
      cCtx.globalAlpha = 1;

      const map = new THREE.CanvasTexture(colC);
      map.colorSpace = THREE.SRGBColorSpace;
      const normalMap = heightCanvasToNormalTexture(hC, 1.8, repeat, repeat);
      const roughnessMap = new THREE.CanvasTexture(rC);
      for (const t of [map, roughnessMap]) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeat, repeat);
        t.anisotropy = 8;
      }
      return { map, normalMap, roughnessMap };
    }

    // Reboco mineral / cimento queimado quente para paredes (com normalMap fino + variação orgânica)
    function createPlasterPBR() {
      const size = 512;
      const col = makeCanvas(size, size);
      const hC = makeCanvas(size, size);
      const cCtx = col.getContext('2d');
      const hCtx = hC.getContext('2d');
      const cImg = cCtx.createImageData(size, size);
      const hImg = hCtx.createImageData(size, size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const broad = fbm2D(x * 0.014, y * 0.014, 4);
          const fine = fbm2D(x * 0.085, y * 0.085, 3);
          const grain = hash2(x, y);
          const v = broad * 0.60 + fine * 0.28 + grain * 0.12;
          const idx = (y * size + x) * 4;
          cImg.data[idx]     = Math.round(216 + (v - 0.5) * 24);
          cImg.data[idx + 1] = Math.round(202 + (v - 0.5) * 22);
          cImg.data[idx + 2] = Math.round(186 + (v - 0.5) * 18);
          cImg.data[idx + 3] = 255;

          const hv = Math.round(128 + (fine * 0.65 + grain * 0.35 - 0.5) * 95);
          hImg.data[idx] = hImg.data[idx + 1] = hImg.data[idx + 2] = hv;
          hImg.data[idx + 3] = 255;
        }
      }
      cCtx.putImageData(cImg, 0, 0);
      hCtx.putImageData(hImg, 0, 0);

      const map = new THREE.CanvasTexture(col);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(3, 2);
      const normalMap = heightCanvasToNormalTexture(hC, 1.35, 3, 2);
      return { map, normalMap };
    }

    // Tecido PBR de alta fidelidade: linho, tricô canelado (suéter/manta), sarja ou bouclé (tapete)
    function createFabricPBR(baseRGB, accentRGB, scale = 5, style = 'linen') {
      const size = 256;
      const col = makeCanvas(size, size);
      const hC = makeCanvas(size, size);
      const cCtx = col.getContext('2d');
      const hCtx = hC.getContext('2d');
      const cImg = cCtx.createImageData(size, size);
      const hImg = hCtx.createImageData(size, size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          let w = 0.5;
          if (style === 'knit') {
            // Malha de tricô orgânica com pontos em V canelados
            const colPhase = (x % 8) / 8.0;
            const rowPhase = ((y + Math.abs(colPhase - 0.5) * 6.0) % 8) / 8.0;
            const rib = Math.sin(colPhase * Math.PI) * 0.65 + Math.sin(rowPhase * Math.PI) * 0.35;
            w = rib * 0.8 + hash2(x, y) * 0.2;
          } else if (style === 'boucle') {
            // Tapete bouclé macio sem quadrados artificiais!
            const n1 = fbm2D(x * 0.14, y * 0.14, 3);
            const n2 = fbm2D(x * 0.035, y * 0.035, 3);
            const weave = Math.sin(y * 0.8) * 0.14 + Math.sin(x * 0.55) * 0.10;
            w = Math.min(1, Math.max(0, n1 * 0.58 + n2 * 0.28 + weave + hash2(x, y) * 0.14));
          } else if (style === 'twill') {
            // Sarja / jeans diagonal
            const diag = Math.sin((x + y) * 1.05) * 0.5 + 0.5;
            const n = fbm2D(x * 0.06, y * 0.06, 2);
            w = diag * 0.55 + n * 0.30 + hash2(x, y) * 0.15;
          } else {
            // Linho natural tramado com irregularidades de fios
            const warp = Math.sin(x * 1.45 + Math.sin(y * 0.08)) * 0.5 + 0.5;
            const weft = Math.sin(y * 1.45 + Math.cos(x * 0.08)) * 0.5 + 0.5;
            const slub = fbm2D(x * 0.04, y * 0.18, 2);
            w = (warp * 0.45 + weft * 0.45) * 0.72 + slub * 0.18 + hash2(x, y) * 0.10;
          }

          const idx = (y * size + x) * 4;
          const jitter = (hash2(x + 7, y + 3) - 0.5) * 10;
          cImg.data[idx]     = Math.min(255, Math.max(0, Math.round(accentRGB[0] + (baseRGB[0] - accentRGB[0]) * w + jitter)));
          cImg.data[idx + 1] = Math.min(255, Math.max(0, Math.round(accentRGB[1] + (baseRGB[1] - accentRGB[1]) * w + jitter)));
          cImg.data[idx + 2] = Math.min(255, Math.max(0, Math.round(accentRGB[2] + (baseRGB[2] - accentRGB[2]) * w + jitter)));
          cImg.data[idx + 3] = 255;

          const hv = Math.min(255, Math.max(0, Math.round(w * 255)));
          hImg.data[idx] = hImg.data[idx + 1] = hImg.data[idx + 2] = hv;
          hImg.data[idx + 3] = 255;
        }
      }
      cCtx.putImageData(cImg, 0, 0);
      hCtx.putImageData(hImg, 0, 0);

      const map = new THREE.CanvasTexture(col);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(scale, scale);
      map.anisotropy = 8;
      const normalStrength = style === 'knit' ? 2.4 : (style === 'boucle' ? 2.2 : 1.5);
      const normalMap = heightCanvasToNormalTexture(hC, normalStrength, scale, scale);
      return { map, normalMap };
    }

    // Cerâmica artesanal pontilhada (speckled stoneware) para a xícara, pires e vasos
    function createCeramicPBR(baseHex = '#ede2d2', speckColor = 'rgba(84, 62, 46, 0.34)') {
      const size = 512;
      const colC = makeCanvas(size, size);
      const hC = makeCanvas(size, size);
      const rC = makeCanvas(size, size);
      const cCtx = colC.getContext('2d');
      const hCtx = hC.getContext('2d');
      const rCtx = rC.getContext('2d');

      cCtx.fillStyle = baseHex;
      cCtx.fillRect(0, 0, size, size);
      hCtx.fillStyle = '#808080';
      hCtx.fillRect(0, 0, size, size);
      rCtx.fillStyle = '#4a4a4a';
      rCtx.fillRect(0, 0, size, size);

      // Anéis sutis de torno de oleiro
      for (let y = 0; y < size; y += 3) {
        const a = 0.015 + Math.sin(y * 0.11) * 0.012;
        cCtx.fillStyle = `rgba(120, 92, 68, ${Math.max(0, a)})`;
        cCtx.fillRect(0, y, size, 2);
        const hv = Math.round(128 + Math.sin(y * 0.17) * 14);
        hCtx.fillStyle = `rgb(${hv},${hv},${hv})`;
        hCtx.fillRect(0, y, size, 2);
      }

      // Pintinhas minerais artesanais de argila queimada
      for (let i = 0; i < 620; i++) {
        const x = hash2(i, 1.7) * size;
        const y = hash2(i, 5.9) * size;
        const rad = 0.6 + hash2(i, 9.3) * 1.9;
        cCtx.fillStyle = speckColor;
        cCtx.beginPath();
        cCtx.arc(x, y, rad, 0, Math.PI * 2);
        cCtx.fill();

        rCtx.fillStyle = 'rgba(175,175,175,0.65)';
        rCtx.beginPath();
        rCtx.arc(x, y, rad * 1.2, 0, Math.PI * 2);
        rCtx.fill();
      }

      const map = new THREE.CanvasTexture(colC);
      map.colorSpace = THREE.SRGBColorSpace;
      const normalMap = heightCanvasToNormalTexture(hC, 1.1, 1, 1);
      const roughnessMap = new THREE.CanvasTexture(rC);
      return { map, normalMap, roughnessMap };
    }

    // Café quente com crema aveludada e micro-bolhas + normalMap de espuma
    function createCoffeePBR() {
      const size = 512;
      const colC = makeCanvas(size, size);
      const hC = makeCanvas(size, size);
      const rC = makeCanvas(size, size);
      const cCtx = colC.getContext('2d');
      const hCtx = hC.getContext('2d');
      const rCtx = rC.getContext('2d');
      const cx = size / 2;

      const grad = cCtx.createRadialGradient(cx, cx, 12, cx, cx, cx);
      grad.addColorStop(0.0, '#140904');
      grad.addColorStop(0.42, '#221007');
      grad.addColorStop(0.68, '#4e2914');
      grad.addColorStop(0.84, '#9b6434');
      grad.addColorStop(0.94, '#c7935b');
      grad.addColorStop(1.0, '#7e4d24');
      cCtx.fillStyle = grad;
      cCtx.fillRect(0, 0, size, size);

      hCtx.fillStyle = '#808080';
      hCtx.fillRect(0, 0, size, size);

      // Centro mais espelhado (roughness baixo), borda de crema mais aveludada
      const rGrad = rCtx.createRadialGradient(cx, cx, 10, cx, cx, cx);
      rGrad.addColorStop(0.0, '#181818');
      rGrad.addColorStop(0.62, '#2c2c2c');
      rGrad.addColorStop(0.86, '#7a7a7a');
      rGrad.addColorStop(1.0, '#9a9a9a');
      rCtx.fillStyle = rGrad;
      rCtx.fillRect(0, 0, size, size);

      // Espiral sutil de crema e micro-bolhas
      for (let i = 0; i < 420; i++) {
        const ang = hash2(i, 1.3) * Math.PI * 2;
        const rad = (0.45 + hash2(i, 4.9) * 0.52) * cx;
        const px = cx + Math.cos(ang) * rad;
        const py = cx + Math.sin(ang) * rad;
        const br = 0.8 + hash2(i, 2.7) * 3.1;
        cCtx.fillStyle = `rgba(226, 178, 122, ${0.10 + hash2(i, 8.2) * 0.24})`;
        cCtx.beginPath();
        cCtx.arc(px, py, br, 0, Math.PI * 2);
        cCtx.fill();

        hCtx.fillStyle = 'rgba(180,180,180,0.45)';
        hCtx.beginPath();
        hCtx.arc(px, py, br, 0, Math.PI * 2);
        hCtx.fill();
      }

      const map = new THREE.CanvasTexture(colC);
      map.colorSpace = THREE.SRGBColorSpace;
      const normalMap = heightCanvasToNormalTexture(hC, 1.2, 1, 1);
      const roughnessMap = new THREE.CanvasTexture(rC);
      return { map, normalMap, roughnessMap };
    }

    // Textura de cabelo com fios verticais naturais + normalMap anisotrópico
    function createHairPBR() {
      const size = 512;
      const colC = makeCanvas(size, size);
      const hC = makeCanvas(size, size);
      const cCtx = colC.getContext('2d');
      const hCtx = hC.getContext('2d');

      cCtx.fillStyle = '#291a12';
      cCtx.fillRect(0, 0, size, size);
      hCtx.fillStyle = '#808080';
      hCtx.fillRect(0, 0, size, size);

      for (let i = 0; i < 520; i++) {
        const x = hash2(i, 2.7) * size;
        const shade = hash2(i, 6.1);
        const r = Math.round(32 + shade * 46);
        const g = Math.round(20 + shade * 30);
        const b = Math.round(14 + shade * 20);
        cCtx.strokeStyle = `rgba(${r},${g},${b},0.62)`;
        cCtx.lineWidth = 0.7 + hash2(i, 9.4) * 2.0;
        cCtx.beginPath();
        cCtx.moveTo(x, 0);
        for (let y = 0; y <= size; y += 32) {
          cCtx.lineTo(x + Math.sin(y * 0.025 + i * 0.3) * 3.5, y);
        }
        cCtx.stroke();

        const hv = Math.round(70 + shade * 145);
        hCtx.strokeStyle = `rgba(${hv},${hv},${hv},0.55)`;
        hCtx.lineWidth = 1.2;
        hCtx.beginPath();
        hCtx.moveTo(x, 0);
        for (let y = 0; y <= size; y += 32) {
          hCtx.lineTo(x + Math.sin(y * 0.025 + i * 0.3) * 3.5, y);
        }
        hCtx.stroke();
      }
      const map = new THREE.CanvasTexture(colC);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(3, 2);
      const normalMap = heightCanvasToNormalTexture(hC, 2.0, 3, 2);
      return { map, normalMap };
    }

    // Textura de folha botânica realista (nervura central, veios laterais, variação de clorofila)
    function createLeafPBR() {
      const w = 256, h = 512;
      const colC = makeCanvas(w, h);
      const hC = makeCanvas(w, h);
      const cCtx = colC.getContext('2d');
      const hCtx = hC.getContext('2d');

      const grad = cCtx.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0, '#274729');
      grad.addColorStop(0.5, '#355f34');
      grad.addColorStop(1, '#46733c');
      cCtx.fillStyle = grad;
      cCtx.fillRect(0, 0, w, h);

      hCtx.fillStyle = '#808080';
      hCtx.fillRect(0, 0, w, h);

      // Manchas orgânicas sutis na lâmina da folha
      for (let i = 0; i < 65; i++) {
        const x = hash2(i, 2.2) * w;
        const y = hash2(i, 8.7) * h;
        const rad = 12 + hash2(i, 4.1) * 30;
        const lg = cCtx.createRadialGradient(x, y, 2, x, y, rad);
        lg.addColorStop(0, hash2(i, 1.1) > 0.5 ? 'rgba(90, 134, 66, 0.16)' : 'rgba(22, 42, 22, 0.16)');
        lg.addColorStop(1, 'rgba(0,0,0,0)');
        cCtx.fillStyle = lg;
        cCtx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
      }

      // Nervura central
      cCtx.strokeStyle = '#689152';
      cCtx.lineWidth = 6;
      cCtx.beginPath();
      cCtx.moveTo(w / 2, h);
      cCtx.lineTo(w / 2, 18);
      cCtx.stroke();

      hCtx.strokeStyle = '#d4d4d4';
      hCtx.lineWidth = 7;
      hCtx.beginPath();
      hCtx.moveTo(w / 2, h);
      hCtx.lineTo(w / 2, 18);
      hCtx.stroke();

      // Nervuras secundárias arqueadas
      for (let i = 1; i <= 9; i++) {
        const y0 = h - i * 48;
        for (const side of [-1, 1]) {
          cCtx.strokeStyle = 'rgba(116, 152, 86, 0.65)';
          cCtx.lineWidth = 2.4;
          cCtx.beginPath();
          cCtx.moveTo(w / 2, y0);
          cCtx.quadraticCurveTo(w / 2 + side * 56, y0 - 20, w / 2 + side * 112, y0 - 65);
          cCtx.stroke();

          hCtx.strokeStyle = 'rgba(185,185,185,0.7)';
          hCtx.lineWidth = 2.6;
          hCtx.beginPath();
          hCtx.moveTo(w / 2, y0);
          hCtx.quadraticCurveTo(w / 2 + side * 56, y0 - 20, w / 2 + side * 112, y0 - 65);
          hCtx.stroke();
        }
      }

      const map = new THREE.CanvasTexture(colC);
      map.colorSpace = THREE.SRGBColorSpace;
      const normalMap = heightCanvasToNormalTexture(hC, 1.9, 1, 1);
      return { map, normalMap };
    }

    // Quadros emoldurados com arte pictórica rica e passe-partout com sombra interna
    function createArtworkTexture(variant = 0) {
      const w = 384, h = 512;
      const c = makeCanvas(w, h);
      const ctx = c.getContext('2d');

      // Papel passe-partout creme
      ctx.fillStyle = '#efe7da';
      ctx.fillRect(0, 0, w, h);

      // Sombra interna sutil do passe-partout
      ctx.fillStyle = 'rgba(42, 30, 22, 0.16)';
      ctx.fillRect(36, 42, w - 72, h - 84);
      ctx.fillStyle = '#e8dcc9';
      ctx.fillRect(40, 46, w - 80, h - 92);

      const ix = 40, iy = 46, iw = w - 80, ih = h - 92;
      if (variant === 0) {
        // Gravura de paisagem costeira ao crepúsculo
        const sky = ctx.createLinearGradient(0, iy, 0, iy + ih * 0.56);
        sky.addColorStop(0, '#2e4159');
        sky.addColorStop(0.55, '#a86f5c');
        sky.addColorStop(1, '#e8bc8e');
        ctx.fillStyle = sky;
        ctx.fillRect(ix, iy, iw, ih * 0.58);

        ctx.fillStyle = 'rgba(255, 228, 186, 0.85)';
        ctx.beginPath();
        ctx.arc(w * 0.58, iy + ih * 0.37, 26, 0, Math.PI * 2);
        ctx.fill();

        // Camadas de montanhas
        ctx.fillStyle = '#5c4b52';
        ctx.beginPath();
        ctx.moveTo(ix, iy + ih * 0.58);
        ctx.lineTo(ix + iw * 0.28, iy + ih * 0.38);
        ctx.lineTo(ix + iw * 0.55, iy + ih * 0.50);
        ctx.lineTo(ix + iw * 0.82, iy + ih * 0.40);
        ctx.lineTo(ix + iw, iy + ih * 0.52);
        ctx.lineTo(ix + iw, iy + ih * 0.58);
        ctx.fill();

        const sea = ctx.createLinearGradient(0, iy + ih * 0.58, 0, iy + ih);
        sea.addColorStop(0, '#384e5e');
        sea.addColorStop(1, '#1d2b36');
        ctx.fillStyle = sea;
        ctx.fillRect(ix, iy + ih * 0.58, iw, ih * 0.42);

        ctx.fillStyle = 'rgba(244, 196, 138, 0.5)';
        for (let i = 0; i < 16; i++) {
          const rw = 44 - i * 1.9;
          ctx.fillRect(w * 0.58 - rw / 2 + Math.sin(i) * 4, iy + ih * 0.60 + i * 9, rw, 2.5);
        }
      } else if (variant === 1) {
        // Arte botânica minimalista em tons terrosos
        ctx.fillStyle = '#d6b48f';
        ctx.beginPath();
        ctx.arc(w * 0.52, h * 0.44, 86, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#334034';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(w * 0.46, iy + ih - 24);
        ctx.quadraticCurveTo(w * 0.52, h * 0.55, w * 0.48, iy + 55);
        ctx.stroke();

        ctx.fillStyle = '#394c39';
        for (let i = 0; i < 7; i++) {
          const y = iy + 95 + i * 36;
          const side = i % 2 === 0 ? 1 : -1;
          ctx.save();
          ctx.translate(w * 0.48, y);
          ctx.rotate(side * 0.55);
          ctx.beginPath();
          ctx.ellipse(side * 30, 0, 30, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      } else {
        // Minimalista arquitetônico em tons areia/terracota/carvão (para a parede esquerda!)
        ctx.fillStyle = '#e5d9c7';
        ctx.fillRect(ix, iy, iw, ih);

        ctx.fillStyle = '#b97252';
        ctx.beginPath();
        ctx.arc(ix + iw * 0.50, iy + ih * 0.40, 74, Math.PI, 0);
        ctx.lineTo(ix + iw * 0.50 + 74, iy + ih * 0.78);
        ctx.lineTo(ix + iw * 0.50 - 74, iy + ih * 0.78);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#2d333b';
        ctx.beginPath();
        ctx.arc(ix + iw * 0.62, iy + ih * 0.58, 44, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#f2e8d9';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(ix + 35, iy + ih * 0.78);
        ctx.lineTo(ix + iw - 35, iy + ih * 0.78);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Página de livro aberto com sombra na lombada e tipografia realista
    function createBookPageTexture(isRight = false) {
      const w = 320, h = 420;
      const c = makeCanvas(w, h);
      const ctx = c.getContext('2d');

      // Papel creme natural com leve sombreamento na direção da lombada
      const grad = ctx.createLinearGradient(isRight ? 0 : w, 0, isRight ? w : 0, 0);
      grad.addColorStop(0.0, '#c8baa2');
      grad.addColorStop(0.14, '#ebe0cc');
      grad.addColorStop(0.88, '#f3e9d8');
      grad.addColorStop(1.0, '#e2d6c0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Título de capítulo no topo
      ctx.fillStyle = 'rgba(56, 44, 34, 0.72)';
      if (!isRight) {
        ctx.fillRect(w * 0.30, 44, w * 0.40, 5);
        ctx.fillStyle = 'rgba(135, 92, 62, 0.45)';
        ctx.fillRect(w * 0.38, 56, w * 0.24, 2);
      }

      // Linhas de texto em parágrafos
      ctx.fillStyle = 'rgba(54, 43, 35, 0.62)';
      const startY = isRight ? 46 : 80;
      for (let y = startY; y < h - 42; y += 13) {
        if ((y - startY) % 91 === 78) continue; // quebra de parágrafo
        const indent = ((y - startY) % 91 === 0) ? 18 : 0;
        const marginL = isRight ? 38 : 30;
        const maxW = w - 68 - indent;
        const isLastLine = ((y - startY) % 91 === 65);
        const lw = isLastLine ? maxW * (0.45 + hash2(y, 1.3) * 0.25) : maxW * (0.88 + hash2(y, 4.1) * 0.12);
        ctx.fillRect(marginL + indent, y, lw, 2.4);
      }

      // Número da página
      ctx.fillStyle = 'rgba(72, 58, 46, 0.5)';
      ctx.fillRect(w * 0.47, h - 24, 18, 2.5);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // =========================================================================
    // 2. RENDERER, CENA, CÂMERA, CONTROLES E PÓS-PROCESSAMENTO CINEMATOGRÁFICO
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true
    });
    const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 820;
    // 20/11: nitidez de antes (2x no celular)
    const baseRatio = Math.min(window.devicePixelRatio, isMobile ? 2.0 : 2.25);
    let curRatio = baseRatio;
    renderer.setPixelRatio(curRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.94;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#191c2b');

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.06, 950);
    camera.position.set(1.24, 1.42, 1.18);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.rotateSpeed = 0.62;
    controls.zoomSpeed = 0.78;
    controls.panSpeed = 0.55;
    controls.minDistance = 0.22;
    controls.maxDistance = 5.4;
    controls.minPolarAngle = 0.22;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.target.set(-0.28, 1.14, -2.18);
    controls.update();

    // EffectComposer: Bloom cinematográfico sutil + OutputPass (ACES) + Film/Lens grading suave
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(Math.floor(window.innerWidth * 0.5), Math.floor(window.innerHeight * 0.5)),
      0.14,  // strength delicado para halo fotográfico só no sol e reflexos intensos
      0.48,  // radius suave
      1.15   // threshold alto: preserva cores ricas do céu e nuvens sem lavar
    );
    composer.addPass(bloomPass);

    const outputPass = new OutputPass();
    composer.addPass(outputPass);

    // Final pass: vinheta óptica sutil 35mm + micro-grão fotográfico + equilíbrio de sombras
    const filmGradeShader = {
      uniforms: {
        tDiffuse: { value: null },
        uTime: { value: 0 },
        uVignette: { value: 0.24 },
        uGrain: { value: 0.011 }
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uVignette;
        uniform float uGrain;
        varying vec2 vUv;

        float rand(vec2 p) {
          return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void main() {
          vec4 tex = texture2D(tDiffuse, vUv);
          vec3 col = tex.rgb;

          // S-curve cinematográfica muito leve (dá profundidade sem esmagar pretos)
          col = mix(col, col * col * (3.0 - 2.0 * col), 0.14);

          // Micro-grão orgânico de filme fotográfico (quebra banding de degradês)
          float g = (rand(vUv * vec2(1280.0, 720.0) + fract(uTime * 0.1)) - 0.5) * uGrain;
          col += vec3(g);

          // Vinheta óptica suave de lente 35mm
          vec2 d = (vUv - 0.5) * vec2(1.15, 1.0);
          float vig = 1.0 - dot(d, d) * uVignette;
          col *= clamp(vig, 0.72, 1.0);

          gl_FragColor = vec4(max(col, 0.0), tex.a);
        }
      `
    };
    const filmPass = new ShaderPass(filmGradeShader);
    composer.addPass(filmPass);

    // =========================================================================
    // 3. PARÂMETROS DINÂMICOS DO PÔR DO SOL
    // =========================================================================
    const sunState = {
      elevationDeg: 6.0,
      azimuthDeg: -5.5,
      dir: new THREE.Vector3(),
      color: new THREE.Color('#ff9d56'),
      horizonColor: new THREE.Color('#f0955a'),
      midSkyColor: new THREE.Color('#8e6274'),
      zenithColor: new THREE.Color('#1c3154')
    };

    function computeSunDir(elevDeg, azimDeg) {
      const phi = THREE.MathUtils.degToRad(elevDeg);
      const theta = THREE.MathUtils.degToRad(azimDeg);
      return new THREE.Vector3(
        Math.sin(theta) * Math.cos(phi),
        Math.sin(phi),
        -Math.cos(theta) * Math.cos(phi)
      ).normalize();
    }
    sunState.dir.copy(computeSunDir(sunState.elevationDeg, sunState.azimuthDeg));

    // =========================================================================
    // 4. CÉU FOTOGRÁFICO COM NUVENS VOLUMÉTRICAS (CIRRUS + CUMULUS RAYMARCH)
    // =========================================================================
    const skyUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: sunState.dir.clone() },
      uZenithColor: { value: sunState.zenithColor.clone() },
      uMidSkyColor: { value: sunState.midSkyColor.clone() },
      uHorizonColor: { value: sunState.horizonColor.clone() },
      uSunColor: { value: new THREE.Color('#ffe4bd') }
    };

    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: /* glsl */`
        varying vec3 vWorldDir;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldDir = normalize(wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform vec3 uZenithColor;
        uniform vec3 uMidSkyColor;
        uniform vec3 uHorizonColor;
        uniform vec3 uSunColor;
        varying vec3 vWorldDir;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          mat2 rot = mat2(0.80, -0.60, 0.60, 0.80);
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p = rot * p * 2.04 + vec2(13.7, 9.2);
            a *= 0.5;
          }
          return v;
        }

        float cloudShape(vec2 uv, float t) {
          vec2 drift = vec2(t * 0.009, t * 0.003);
          float warp = fbm(uv * 0.95 + drift * 0.8);
          float c1 = fbm(uv * 1.25 + drift + vec2(warp * 0.55, -warp * 0.35));
          float c2 = fbm(uv * 2.90 - drift * 0.7 + vec2(c1 * 0.45));
          return smoothstep(0.45, 0.80, c1 * 0.72 + c2 * 0.34);
        }

        void main() {
          vec3 dir = normalize(vWorldDir);
          vec3 sDir = normalize(uSunDir);
          float y = clamp(dir.y, -0.2, 1.0);
          float h = clamp(dir.y, 0.0, 1.0);
          float sunDot = max(dot(dir, sDir), 0.0);

          // Gradiente atmosférico Rayleigh-Mie rico (azul cobalto -> malva -> pêssego dourado)
          vec3 col = mix(uHorizonColor, uMidSkyColor, smoothstep(0.0, 0.22, h));
          col = mix(col, uZenithColor, smoothstep(0.14, 0.62, h));

          // Faixa quente no horizonte apenas na direção do sol (cores ricas sem estourar!)
          float azimGlow = pow(sunDot, 2.2) * pow(1.0 - h, 4.2);
          col += vec3(0.46, 0.19, 0.06) * azimGlow * 0.56;

          // Bruma quente rasante bem junto à linha do mar
          float belt = exp(-abs(dir.y - 0.014) * 20.0) * (0.22 + 0.78 * pow(sunDot, 2.8));
          col += vec3(0.36, 0.17, 0.07) * belt * 0.36;

          // Espalhamento de Mie fotográfico (halo dourado rico sem lavar o céu em branco!)
          float mieWide = pow(sunDot, 12.0) * 0.18;
          float mieMed  = pow(sunDot, 96.0) * 0.36;
          float mieCore = pow(sunDot, 680.0) * 0.55;
          col += vec3(0.98, 0.52, 0.22) * mieWide + vec3(1.0, 0.72, 0.40) * mieMed + uSunColor * mieCore;

          // Disco solar nítido de escala fotográfica natural (sem virar clarão branco)
          float sunDisc = smoothstep(0.99968, 0.99988, sunDot);
          col = mix(col, vec3(1.75, 1.38, 0.92), sunDisc);

          // Camada 1: Cirrus altos fibrosos esticados pelo vento
          if (dir.y > 0.015) {
            vec2 cirrusUV = dir.xz / (dir.y + 0.28);
            vec2 stretched = vec2(cirrusUV.x * 0.85, cirrusUV.y * 2.65) + vec2(uTime * 0.005, 0.0);
            float ci = fbm(stretched * 1.45 + vec2(fbm(stretched * 0.8) * 0.7));
            float cirrusMask = smoothstep(0.56, 0.84, ci) * smoothstep(0.02, 0.16, dir.y) * smoothstep(0.65, 0.15, dir.y);
            vec3 cirrusCol = mix(vec3(0.84, 0.56, 0.52), vec3(1.25, 0.88, 0.62), pow(sunDot, 2.2));
            col = mix(col, cirrusCol, cirrusMask * 0.36);
          }

          // Camada 2: Stratocumulus volumétricos com sombreamento direcional em 3 passos (Beer-Lambert)
          if (dir.y > 0.012) {
            vec2 cloudUV = dir.xz / (dir.y + 0.145);
            float d0 = cloudShape(cloudUV, uTime);
            float horizonFade = smoothstep(0.014, 0.125, dir.y) * smoothstep(0.82, 0.18, dir.y);
            float density = d0 * horizonFade * 0.92;

            if (density > 0.004) {
              vec2 sunStep = normalize(sDir.xz) * 0.075;
              float occ = 0.0;
              occ += cloudShape(cloudUV + sunStep * 1.0, uTime) * 0.50;
              occ += cloudShape(cloudUV + sunStep * 2.2, uTime) * 0.32;
              occ += cloudShape(cloudUV + sunStep * 3.8, uTime) * 0.18;

              float transmittance = exp(-occ * 2.15);
              float silver = pow(sunDot, 6.0) * exp(-density * 1.9) * 0.95;

              vec3 shadowCol = mix(vec3(0.16, 0.15, 0.25), vec3(0.38, 0.24, 0.30), pow(sunDot, 1.8));
              vec3 litCol    = mix(vec3(0.95, 0.58, 0.40), vec3(1.38, 0.96, 0.62), pow(sunDot, 2.5));
              vec3 cloudCol  = mix(shadowCol, litCol, clamp(transmittance * 0.88 + silver * 0.55, 0.0, 1.0));
              // Borda dourada extra voltada ao disco solar
              cloudCol += vec3(1.15, 0.72, 0.36) * silver * 0.42;

              col = mix(col, cloudCol, density);
            }
          }

          if (y < 0.0) {
            col = mix(col, vec3(0.07, 0.10, 0.16), smoothstep(0.0, -0.05, y));
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(480, 56, 36), skyMat);
    scene.add(skyDome);

    // =========================================================================
    // 5. MAR FOTORREALISTA (SWELL + 6 CAMADAS MULTI-DIRECIONAIS + GGX GLITTER)
    // =========================================================================
    const oceanUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: sunState.dir.clone() },
      uSunColor: { value: new THREE.Color('#ffbe78') },
      uHorizonColor: { value: sunState.horizonColor.clone() },
      uMidSkyColor: { value: sunState.midSkyColor.clone() },
      uSkyColor: { value: new THREE.Color('#2d3e62') },
      uDeepWater: { value: new THREE.Color('#091928') },
      uShallowWater: { value: new THREE.Color('#133548') }
    };

    const oceanGeo = new THREE.PlaneGeometry(780, 440, 200, 140);
    oceanGeo.rotateX(-Math.PI / 2);

    const oceanMat = new THREE.ShaderMaterial({
      uniforms: oceanUniforms,
      vertexShader: /* glsl */`
        uniform float uTime;
        varying vec3 vWorldPos;
        varying float vWaveH;

        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float dist = length(wp.xz - vec2(0.0, -10.0));
          float damp = smoothstep(380.0, 24.0, dist);

          float w1 = sin(wp.x * 0.08 + wp.z * 0.13 + uTime * 1.05) * 0.22;
          float w2 = sin(wp.x * -0.14 + wp.z * 0.18 + uTime * 1.38) * 0.14;
          float w3 = cos(wp.x * 0.21 - wp.z * 0.09 - uTime * 0.85) * 0.09;
          float h = (w1 + w2 + w3) * damp;

          wp.y += h;
          vWorldPos = wp.xyz;
          vWaveH = h;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform vec3 uSunColor;
        uniform vec3 uHorizonColor;
        uniform vec3 uMidSkyColor;
        uniform vec3 uSkyColor;
        uniform vec3 uDeepWater;
        uniform vec3 uShallowWater;

        varying vec3 vWorldPos;
        varying float vWaveH;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        // Ondas naturais multi-direcionais (sem listras horizontais artificiais)
        float waveHeight(vec2 p) {
          float t = uTime;
          mat2 r1 = mat2(0.86, -0.50, 0.50, 0.86);
          mat2 r2 = mat2(0.60, 0.80, -0.80, 0.60);
          float h = 0.0;
          vec2 p1 = r1 * p;
          vec2 p2 = r2 * p;
          h += (noise(p1 * 0.16 + vec2(t * 0.24, t * 0.16)) - 0.5) * 0.34;
          h += (noise(p2 * 0.34 - vec2(t * 0.32, -t * 0.22)) - 0.5) * 0.19;
          h += (noise(p  * 0.78 + vec2(-t * 0.42, t * 0.29)) - 0.5) * 0.10;
          h += (noise(p1 * 1.75 + vec2(t * 0.58, -t * 0.38)) - 0.5) * 0.048;
          h += (noise(p2 * 3.60 - vec2(t * 0.72, t * 0.45)) - 0.5) * 0.020;
          return h;
        }

        // GGX microfacet specular para glitter fotográfico do pôr do sol
        float ggxSpec(vec3 N, vec3 V, vec3 L, float rough) {
          vec3 H = normalize(L + V);
          float a = rough * rough;
          float a2 = a * a;
          float NdotH = max(dot(N, H), 0.0);
          float d = (NdotH * NdotH) * (a2 - 1.0) + 1.0;
          return a2 / max(3.14159 * d * d, 0.0001);
        }

        void main() {
          vec2 p = vWorldPos.xz;
          float dist = length(vWorldPos - cameraPosition);
          float eps = mix(0.14, 0.85, clamp(dist / 260.0, 0.0, 1.0));

          float hC = waveHeight(p);
          float hX = waveHeight(p + vec2(eps, 0.0));
          float hZ = waveHeight(p + vec2(0.0, eps));
          vec3 N = normalize(vec3(hC - hX, eps * 1.75, hC - hZ));

          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 L = normalize(uSunDir);
          vec3 R = reflect(-V, N);

          float NdotV = max(dot(N, V), 0.001);
          float fresnel = 0.02 + 0.98 * pow(1.0 - NdotV, 5.0);

          // Reflexo fiel do gradiente do céu + nuvens refletidas na água
          float reflY = clamp(R.y, 0.0, 1.0);
          vec3 skyRefl = mix(uHorizonColor * 0.94, uMidSkyColor, smoothstep(0.0, 0.24, reflY));
          skyRefl = mix(skyRefl, uSkyColor, smoothstep(0.20, 0.62, reflY));
          float sunAlign = pow(max(dot(R, L), 0.0), 4.5);
          skyRefl += uSunColor * sunAlign * 0.42;

          // Sombreamento sutil refletido das montanhas nas margens laterais da baía
          float bayShade = smoothstep(22.0, 88.0, abs(p.x)) * smoothstep(240.0, 75.0, dist);
          skyRefl *= (1.0 - bayShade * 0.42);

          // Subsurface scattering sutil nas cristas iluminadas contra o sol
          float crest = smoothstep(0.04, 0.34, vWaveH + hC * 0.45);
          float sss = pow(max(dot(-V, L), 0.0), 3.0) * crest * 0.35;
          vec3 waterBase = mix(uDeepWater, uShallowWater, crest * 0.52) + vec3(0.12, 0.24, 0.22) * sss;

          vec3 col = mix(waterBase, skyRefl, clamp(fresnel * 0.90, 0.14, 0.94));

          // Caminho dourado GGX (brilho amplo suave + centenas de centelhas finas)
          float specBroad = ggxSpec(N, V, L, 0.20) * 0.14;
          float specGlint = ggxSpec(N, V, L, 0.048) * 0.045;
          col += uSunColor * (specBroad + min(specGlint, 2.2));

          // Espuma sutil nas cristas mais altas e próximas
          float foamMask = smoothstep(0.24, 0.44, hC) * smoothstep(130.0, 20.0, dist);
          col = mix(col, mix(vec3(0.84, 0.78, 0.74), uHorizonColor, 0.42), foamMask * 0.22);

          // Integração atmosférica suave na linha do horizonte
          float horizonBlend = smoothstep(200.0, 425.0, dist);
          col = mix(col, uHorizonColor * 0.86, horizonBlend * 0.86);

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
    oceanMesh.position.set(0, -8.8, -218);
    scene.add(oceanMesh);

    // =========================================================================
    // 6. MONTANHAS COSTEIRAS COM RELEVO ROCHOSO, VEGETAÇÃO E ESPUMA COSTEIRA
    // =========================================================================
    const mountainUniforms = {
      uSunDir: { value: sunState.dir.clone() },
      uSunColor: { value: new THREE.Color('#ffaa68') },
      uHorizonColor: { value: sunState.horizonColor.clone() },
      uSkyAmbient: { value: new THREE.Color('#3b4a6e') }
    };

    function createMountainMaterial(hazeStrength = 0.32) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uSunDir: mountainUniforms.uSunDir,
          uSunColor: mountainUniforms.uSunColor,
          uHorizonColor: mountainUniforms.uHorizonColor,
          uSkyAmbient: mountainUniforms.uSkyAmbient,
          uHazeStrength: { value: hazeStrength }
        },
        vertexShader: /* glsl */`
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying float vHeight;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            vHeight = wp.y;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */`
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform vec3 uHorizonColor;
          uniform vec3 uSkyAmbient;
          uniform float uHazeStrength;

          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          varying float vHeight;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }
          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }
          float fbm(vec2 p) {
            float v = 0.0, a = 0.5;
            mat2 m = mat2(0.8, -0.6, 0.6, 0.8);
            for (int i = 0; i < 4; i++) {
              v += a * noise(p);
              p = m * p * 2.08;
              a *= 0.5;
            }
            return v;
          }

          void main() {
            vec3 baseN = normalize(vWorldNormal);
            vec3 L = normalize(uSunDir);
            vec3 V = normalize(cameraPosition - vWorldPos);

            // Perturbação detalhada de normal (rochas estratificadas + textura de floresta)
            vec2 rp = vWorldPos.xz * 0.19;
            float d0 = fbm(rp);
            float dx = fbm(rp + vec2(0.18, 0.0)) - d0;
            float dz = fbm(rp + vec2(0.0, 0.18)) - d0;
            float strata = sin(vHeight * 0.85 + d0 * 4.0) * 0.08;
            vec3 N = normalize(baseN + vec3(-dx * 1.45, strata, -dz * 1.45));

            float slope = 1.0 - clamp(N.y, 0.0, 1.0);
            float canopy = fbm(vWorldPos.xz * 0.58);

            // Bioma rico de costa montanhosa: rocha úmida na base, mata densa nas encostas, granito nos cumes
            vec3 wetRock = vec3(0.14, 0.13, 0.15);
            vec3 granite = mix(vec3(0.24, 0.22, 0.25), vec3(0.36, 0.31, 0.30), d0);
            vec3 forest  = mix(vec3(0.08, 0.17, 0.10), vec3(0.18, 0.27, 0.14), canopy);

            float rockMask = smoothstep(0.24, 0.56, slope + d0 * 0.22);
            float highMask = smoothstep(16.0, 42.0, vHeight + d0 * 8.0);
            vec3 albedo = mix(forest, granite, clamp(rockMask * 0.88 + highMask * 0.62, 0.0, 1.0));
            albedo = mix(wetRock, albedo, smoothstep(-9.2, -5.0, vHeight));

            // Iluminação física com luz solar rasante, bounce do céu e micro-AO de vales
            float NdotL = max(dot(N, L), 0.0);
            float wrap = max((dot(N, L) + 0.44) / 1.44, 0.0);
            float valleyAO = 0.66 + 0.34 * smoothstep(-6.0, 26.0, vHeight) * (0.6 + 0.4 * d0);
            vec3 direct = uSunColor * (NdotL * 1.55 + pow(NdotL, 3.0) * 0.38);
            vec3 skyFill = mix(vec3(0.26, 0.24, 0.38), uSkyAmbient, 0.58);
            vec3 ambient = skyFill * (0.64 + 0.36 * max(N.y, 0.0)) * valleyAO;

            // Rim light dourado nas cristas contra o sol (realça o recorte das montanhas!)
            float rim = pow(1.0 - max(dot(N, V), 0.0), 2.8) * pow(max(dot(-V, L), 0.0), 2.0) * smoothstep(-4.0, 12.0, vHeight);
            vec3 col = albedo * (ambient + direct * wrap) + uSunColor * rim * 0.32;

            // Linha sutil de arrebentação/espuma branca onde a encosta mergulha no mar (y ≈ -8.8)
            float shoreFoam = exp(-abs(vHeight - (-8.65)) * 2.4) * (0.55 + 0.45 * noise(vWorldPos.xz * 0.6));
            col = mix(col, mix(vec3(0.84, 0.78, 0.74), uHorizonColor, 0.45), shoreFoam * 0.62);

            // Perspectiva aérea realista (dá profundidade entre cadeias sem virar nevoeiro leitoso)
            float dist = length(vWorldPos - cameraPosition);
            float aerial = clamp((dist - 50.0) / 295.0, 0.0, 1.0) * uHazeStrength;
            vec3 hazeCol = mix(vec3(0.36, 0.29, 0.42), uHorizonColor * 0.88, 0.62);
            col = mix(col, hazeCol, aerial);

            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
    }

    function buildMountainRange({ width, depth, segX, segZ, heightScale, seed, ridgeProfile, pos, haze }) {
      const geo = new THREE.PlaneGeometry(width, depth, segX, segZ);
      geo.rotateX(-Math.PI / 2);
      const posAttr = geo.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        const x = posAttr.getX(i);
        const z = posAttr.getZ(i);
        const nx = x / (width * 0.5);
        const nz = z / (depth * 0.5);

        const envX = Math.max(0, 1.0 - nx * nx);
        const envZ = Math.max(0, 1.0 - nz * nz);
        const env = Math.pow(envX, 1.32) * Math.pow(envZ, 1.38);

        const shape = ridgeProfile(nx, nz);
        const r = ridged2D(x * 0.017 + seed, z * 0.017 - seed * 0.7, 5);
        const f = fbm2D(x * 0.032 - seed, z * 0.032 + seed, 4);
        const h = (r * 0.60 + f * 0.45) * heightScale * env * shape;
        posAttr.setY(i, h - 1.2);
      }
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, createMountainMaterial(haze));
      mesh.position.copy(pos);
      scene.add(mesh);
      return mesh;
    }

    // Promontório imponente à direita

        const y = pos.getY(i);
        const u = (x / width) + 0.5;          // 0 .. 1

        const bottomCalm = 1.0 - 0.45 * smoothstepJS(0.84, 1.0, v);

      vertexShader: /* glsl */`
        uniform float uTime;
        attribute float aPhase;
        varying vec2 vUv;
        varying float vPhase;
        varying float vViewFade;
        void main() {
          vUv = uv;
          vPhase = aPhase;
          vec3 p = position;
          float h = uv.y;
          // Turbulência sinuosa mais ampla conforme o vapor sobe e se abre
          float swirl = h * h * 0.058 + h * 0.018;
          p.x += sin(h * 4.2 - uTime * 1.15 + aPhase) * swirl;
          p.z += cos(h * 3.6 - uTime * 0.92 + aPhase * 1.6) * swirl;

          vec4 wp = modelMatrix * vec4(p, 1.0);
          vec3 worldNormal = normalize(mat3(modelMatrix) * normal);
          vec3 viewDir = normalize(cameraPosition - wp.xyz);
          // Suaviza planos vistos de quina para eliminar linhas verticais!
          vViewFade = pow(abs(dot(worldNormal, viewDir)), 1.35);

          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform vec3 uTint;
        varying vec2 vUv;
        varying float vPhase;
        varying float vViewFade;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          mat2 m = mat2(0.8, -0.6, 0.6, 0.8);
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p = m * p * 2.04 + vec2(3.7, 6.1);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 uv = vUv;
          // Distorção orgânica do eixo central (forma voluta de vapor, não tubo reto)

          float spread = 0.34 + uv.y * 0.72;
          float radial = smoothstep(1.0, 0.0, xDist / spread);
          radial = radial * radial;

          float vertical = smoothstep(0.0, 0.18, uv.y) * smoothstep(1.0, 0.25, uv.y);

          vec2 q = vec2(uv.x * 2.2, uv.y * 2.4 - uTime * 0.48);
          float warp = fbm(q + vec2(vPhase, 0.0));
          float n = fbm(q * 1.55 + vec2(warp * 0.9, -uTime * 0.25));
          float wisp = smoothstep(0.36, 0.78, n);

          float alpha = radial * vertical * wisp * vViewFade * 0.30;
          if (alpha < 0.004) discard;
          gl_FragColor = vec4(uTint, alpha);
        }
      `

        side: THREE.DoubleSide,
        vertexShader: /* glsl */`
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);

            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * mv;

          uniform float uGlow;
          uniform sampler2D uMap;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPos;

          void main() {
            // Trama de linho fina visível no close-up
            vec3 fabric = texture2D(uMap, vUv * vec2(10.0, 5.0)).rgb;
            float weaveVar = dot(fabric, vec3(0.333));

            col *= thickness * (0.55 + 0.45 * edgeDark) * uGlow;

            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      // Encosto curvo ergonômico em madeira torneada perfeitamente conectado aos montantes
      const backArc = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.225, 0.745, 0.065),

        new THREE.Vector3(-0.115, 0.790, 0.262),

      for (const rx of [-0.095, 0.0, 0.095]) {

        spindle.position.set(rx, 0.615, zOff);
        spindle.rotation.x = 0.16;
        spindle.castShadow = true;
        g.add(spindle);
      }

      return g;
    }
    const deskChair = createScandinavianChair();

    scene.add(deskChair);

    // =========================================================================
    // 11. PERSONAGEM REALISTA ESTILO NPC MODERNO (GLB RIGGED + VESTIDO DE PRAIA + CABELO LISO EM CIMA + TRANÇAS LONGAS + 360°)
    // =========================================================================
    const personGroup = new THREE.Group();
    // Posicionada com folga da janela (z = -2.36) para permitir girar a câmera 360° completos ao redor dela e dar zoom de perto!
    // Agora debruçada no peitoril da janela (topo em y = 0.814, borda da frente em z = -3.10), olhando o mar e o pôr do sol à direita

    const npcRig = {
