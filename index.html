    // Rotaciona um osso usando um eixo no espaço da personagem (+X direita da tela/esquerda dela, +Y cima, +Z frente dela)
    function rotateBoneInModelSpace(bone, axisVec, angleRad, modelRoot) {
      if (!bone || !bone.parent || Math.abs(angleRad) < 1e-6) return;
      modelRoot.updateMatrixWorld(true);
      const rootQuat = new THREE.Quaternion();
      modelRoot.getWorldQuaternion(rootQuat);
      const worldAxis = axisVec.clone().normalize().applyQuaternion(rootQuat);

      const parentWorldQuat = new THREE.Quaternion();
      bone.parent.getWorldQuaternion(parentWorldQuat);
      const localAxis = worldAxis.clone().applyQuaternion(parentWorldQuat.clone().invert()).normalize();

      const deltaQ = new THREE.Quaternion().setFromAxisAngle(localAxis, angleRad);
      bone.quaternion.premultiply(deltaQ);
      bone.updateMatrixWorld(true);
    }

    // Vento no vestido: a barra (abaixo da cintura, só pixels de tecido) infla para FORA, nunca para dentro das pernas
    function addDressSway(mesh, mat, baseImage) {
      const geo = mesh.geometry, pos = geo.attributes.position, uv = geo.attributes.uv;
      if (!uv || !baseImage) return;
      const w = 512, h = 512;
      const c = makeCanvas(w, h);
      const ctx = c.getContext('2d');
      ctx.drawImage(baseImage, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data;
      let yMin = Infinity, yMax = -Infinity;
      for (let i = 0; i < pos.count; i++) { const y = pos.getY(i); if (y < yMin) yMin = y; if (y > yMax) yMax = y; }
      const unit = (yMax - yMin) / 1.71;
      const sway = new Float32Array(pos.count);
      let flagged = 0;
      for (let i = 0; i < pos.count; i++) {
        const u = uv.getX(i) - Math.floor(uv.getX(i));
        const v = uv.getY(i) - Math.floor(uv.getY(i));
        const idx = (Math.min(h - 1, Math.floor(v * h)) * w + Math.min(w - 1, Math.floor(u * w))) * 4;
        const r = d[idx], g = d[idx + 1], b = d[idx + 2];
        const inDress = v >= 0.442 && u >= 0.596 && !(v < 0.462 && u < 0.865) && !(v >= 0.665 && v <= 0.785 && u >= 0.935) && (r - b) < 38 && (r + g + b) > 12;
        const yRel = (pos.getY(i) - yMin) / (yMax - yMin);
        const k = Math.min(1, Math.max(0, (0.56 - yRel) / 0.16));
        sway[i] = inDress ? Math.pow(k, 1.4) : 0;
        if (sway[i] > 0.05) flagged++;
      }
      geo.setAttribute('aSway', new THREE.BufferAttribute(sway, 1));
      npcRig.swayU = { uSwayTime: { value: 0 }, uWind: { value: 0 }, uUnit: { value: unit } };
      npcRig.swayFlagged = flagged;
      mat.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, npcRig.swayU);
        shader.vertexShader = 'attribute float aSway;\nuniform float uSwayTime;\nuniform float uWind;\nuniform float uUnit;\n' + shader.vertexShader.replace(
          '#include <begin_vertex>',
          `#include <begin_vertex>
          float swPh = (position.y / uUnit) * 38.0 + (position.x / uUnit) * 21.0 + uSwayTime * 2.1;
          float swR = 0.5 + 0.5 * sin(swPh);
          transformed += normalize(objectNormal) * aSway * (0.25 + 0.75 * uWind) * (0.35 + 0.65 * swR) * 0.011 * uUnit;`
        );
      };
      mat.needsUpdate = true;
    }

    // Customiza o atlas de textura 2048x2048 da personagem usando máscara contínua nas regiões exatas do vestido, pele e cabelo (zero pixels falhados!)
    function customizeGirlfriendAtlas(baseImage, maxAniso) {
      const w = Math.min(1024, baseImage.width || 1024);
      const h = Math.min(1024, baseImage.height || 1024);
      const c = makeCanvas(w, h);
      const ctx = c.getContext('2d');
      ctx.drawImage(baseImage, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;

      // Tom de pele médio (bochechas) para a região do "cabelo" do modelo base: o couro cabeludo fica escondido pelo
      // boné de cabelo 3D e a cunha escura de têmpora/costeleta vira pele, em vez de um bloco preto ao lado do rosto.
      const skinAvg = [0, 0, 0];
      {
        let n = 0;
        for (let y = Math.floor(h * 0.22); y < Math.floor(h * 0.30); y++) {
          for (let x = Math.floor(w * 0.19); x < Math.floor(w * 0.24); x++) {
            const i = (y * w + x) * 4;
            skinAvg[0] += d[i]; skinAvg[1] += d[i + 1]; skinAvg[2] += d[i + 2]; n++;
          }
        }
        skinAvg[0] /= n; skinAvg[1] /= n; skinAvg[2] /= n;
      }

      for (let y = 0; y < h; y++) {
        const v = y / h;
        for (let x = 0; x < w; x++) {
          const u = x / w;
          const idx = (y * w + x) * 4;
          let r = d[idx], g = d[idx + 1], b = d[idx + 2];

          const isHairRegion = (
            (v < 0.366 && (u < 0.171 || u > 0.464) && u < 0.645) ||
            (v < 0.122 && u >= 0.190 && u <= 0.440)
          );
          const isEyeRegion = (
            (v < 0.118 && u >= 0.078 && u <= 0.200) ||
            (v < 0.118 && u >= 0.434 && u <= 0.562)
          );
          const isTeethRegion = (
            (v > 0.385 && v < 0.455 && u > 0.546 && u < 0.860) ||
            (v > 0.908 && u > 0.224 && u < 0.528) ||
            (v > 0.673 && v < 0.757 && u > 0.239 && u < 0.337)
          );

          // Na região da gola/corpo do vestido, todo pixel de tecido taupe tem saturação baixa ((r - b) < 28) enquanto a pele ao redor tem (r - b) > 40
          const isDressCollarBox = (v >= 0.395 && v <= 0.542 && u >= 0.080 && u <= 0.568);
          const isDressBodyBox = (
            v >= 0.442 && u >= 0.568 &&
            !(v < 0.462 && u < 0.865) &&
            !(v >= 0.665 && v <= 0.785 && u >= 0.935)
          );
          // Pixels escuros demais (costura/gola do modelo base) dentro do tecido também viram vestido: sem fresta preta nas costas nem cunha escura na gola
          const isDressPixel = (isDressCollarBox || isDressBodyBox) && (((r - b) < 38) || (r <= 68 && (r + g + b) < 300)) && ((r + g + b) > 3);

          const isShoeRegion = (
            v >= 0.095 && v <= 0.385 && u >= 0.750 && u <= 1.0
          );

          if (isEyeRegion || isTeethRegion) {
            continue;
          }

          if (isHairRegion) {
            // Cabelo liso sedoso castanho-escuro/preto natural com fios alinhados e reflexo acetinado (sem aspecto crespo/dreads!)
            d[idx]     = Math.round(skinAvg[0] * 0.87);
            d[idx + 1] = Math.round(skinAvg[1] * 0.80);
            d[idx + 2] = Math.round(skinAvg[2] * 0.73);
            continue;
          }

          if (isDressPixel) {
            // Vestido de praia leve em linho/viscose off-white/creme ensolarado 100% contínuo (sem manchas nem costuras escuras!)
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
            const fold = Math.min(1.12, Math.max(0.76, 0.82 + (lum - 0.24) * 0.95));
            const weave = (hash2(x * 0.5, y * 0.5) - 0.5) * 4.0;

            let dr = 247 * fold + weave;
            let dg = 238 * fold + weave;
            let db = 221 * fold + weave;

            // Toque sutil de degradê praiano dourado-areia e barrado delicado na barra do vestido (u perto de 0.60..0.66)
            if (isDressBodyBox && u <= 0.68) {
              const hemT = Math.max(0, Math.min(1, (0.68 - u) / 0.08));
              dr -= hemT * 10 * fold;
              dg -= hemT * 15 * fold;
              db -= hemT * 22 * fold;
            }

            d[idx]     = Math.max(0, Math.min(255, Math.round(dr)));
            d[idx + 1] = Math.max(0, Math.min(255, Math.round(dg)));
            d[idx + 2] = Math.max(0, Math.min(255, Math.round(db)));
            continue;
          }

          if (isShoeRegion) {
            // Sandália rasteirinha de praia em couro caramelo/dourado
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
            // Remendo marrom do decote (peito sob a gola): vira o mesmo tom de pele do pescoço, sem cunha escura
            if (lum >= 0.28 && v >= 0.12 && v <= 0.30 && u >= 0.78 && u <= 0.97) {
              d[idx]     = Math.round(skinAvg[0] * 0.87);
              d[idx + 1] = Math.round(skinAvg[1] * 0.80);
              d[idx + 2] = Math.round(skinAvg[2] * 0.73);
              continue;
            }
            if (lum < 0.28) {
              const s = 0.74 + lum * 1.1;
              d[idx]     = Math.min(255, Math.round(186 * s));
              d[idx + 1] = Math.min(255, Math.round(130 * s));
              d[idx + 2] = Math.min(255, Math.round(88  * s));
              continue;
            }
          }

          // Pele: tom moreno brasileiro dourado e uniforme (preservando sombreamento natural sem manchas!)
          const isSkin = (r > b + 14 && g > b + 5 && r > 68);
          if (isSkin) {
            let sr = r * 0.87;
            let sg = g * 0.80;
            let sb = b * 0.73;

            // Suaviza o escurecimento excessivo dos joelhos da textura base nas pernas
            if (v >= 0.45 && u >= 0.27 && u <= 0.61) {
              const legLum = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
              const lift = Math.max(0.0, 0.56 - legLum) * 0.45;
              sr = sr * (1.0 + lift) + 12 * lift;
              sg = sg * (1.0 + lift) + 9  * lift;
              sb = sb * (1.0 + lift) + 6  * lift;
            }

            // Rosto (u: 0.13..0.51, v: 0.11..0.41): blush quente sutil nas maçãs do rosto e lábios com sorriso vivo
            if (v >= 0.11 && v <= 0.41 && u >= 0.13 && u <= 0.51) {
              const dCheekL = Math.hypot((u - 0.210) / 0.054, (v - 0.262) / 0.041);
              const dCheekR = Math.hypot((u - 0.422) / 0.054, (v - 0.262) / 0.041);
              const cheek = Math.max(0, 1 - Math.min(dCheekL, dCheekR));
              if (cheek > 0) {
                sr += cheek * 11;
                sg += cheek * 3;
                sb -= cheek * 2;
              }
              const dLips = Math.hypot((u - 0.316) / 0.060, (v - 0.347) / 0.027);
              if (dLips < 1.0) {
                const lt = (1.0 - dLips) * 0.32;
                sr = sr * (1 - lt) + 194 * lt;
                sg = sg * (1 - lt) + 96  * lt;
                sb = sb * (1 - lt) + 84  * lt;
              }
            }

            d[idx]     = Math.max(0, Math.min(255, Math.round(sr)));
            d[idx + 1] = Math.max(0, Math.min(255, Math.round(sg)));
            d[idx + 2] = Math.max(0, Math.min(255, Math.round(sb)));
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);

      // Sobrancelhas escuras expressivas nas coordenadas normalizadas exatas do atlas 2048x2048
      ctx.save();
      ctx.strokeStyle = 'rgba(24, 15, 11, 0.62)';
      ctx.lineWidth = w * 0.0052;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(w * 0.217, h * 0.180);
      ctx.quadraticCurveTo(w * 0.254, h * 0.168, w * 0.289, h * 0.180);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(w * 0.344, h * 0.180);
      ctx.quadraticCurveTo(w * 0.379, h * 0.168, w * 0.416, h * 0.180);
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.flipY = false;
      tex.anisotropy = maxAniso;
      tex.needsUpdate = true;
      return tex;
    }

    // =========================================================================
    // CABELO NATURAL (fosco, sem risca, franja reta), BRINCOS E TRANÇAS DE 3 FIOS
    // Tudo no referencial do rosto: x = esquerda dela, y = cima, z = frente, origem = meio dos olhos (metros).
    // O cabelo e os brincos ficam presos no osso da cabeça; as tranças ficam presas no pescoço.
    // =========================================================================
    function attachGirlfriendBraidsAndDress(avatarRoot, bones, maxAniso) {
      avatarRoot.updateMatrixWorld(true);
      const V3 = THREE.Vector3;

      // Textura de fios finos: linhas verticais castanho-escuras, sem brilho. A versão girada serve para os tubos das tranças.
      function makeStrandTexture(rotated) {
        const c = makeCanvas(512, 512);
        const g = c.getContext('2d');
        g.fillStyle = '#150e0b';
        g.fillRect(0, 0, 512, 512);
        // faixas largas e suaves (mechas) + fios finos por cima
        for (let i = 0; i < 40; i++) {
          const x = (i * 97) % 512;
          const l = 10 + ((i * 29) % 100) * 0.10;
          g.fillStyle = `rgba(${Math.round(l + 12)}, ${Math.round(l + 7)}, ${Math.round(l + 3)}, 0.25)`;
          g.fillRect(x, 0, 6 + (i % 4) * 5, 512);
        }
        for (let i = 0; i < 320; i++) {
          const x = (i * 37) % 512 + ((i * 13) % 7) * 0.45;
          const l = 8 + ((i * 53) % 100) * 0.18;
          const a = 0.30 + 0.45 * (((i * 17) % 10) / 10);
          g.strokeStyle = `rgba(${Math.round(l + 16)}, ${Math.round(l + 9)}, ${Math.round(l + 3)}, ${a})`;
          g.lineWidth = 1.0 + (i % 3) * 0.6;
          g.beginPath();
          g.moveTo(x, 0);
          g.lineTo(x + ((i % 5) - 2) * 0.9, 512);
          g.stroke();
        }
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.anisotropy = maxAniso;
        if (rotated) {
          t.center.set(0.5, 0.5);
          t.rotation = Math.PI / 2;
        }
        return t;
      }

      // Cabelo fosco com brilho de seda bem suave e igual dos dois lados (sem clearcoat, sem reflexo espelhado)
      function makeHairMaterial(rotated, repeatU, repeatV) {
        const map = makeStrandTexture(rotated);
        map.repeat.set(repeatU, repeatV);
        return new THREE.MeshPhysicalMaterial({
          color: '#ffffff',
          map,
          roughness: 0.74,
          metalness: 0.0,
          sheen: 0.5,
          sheenRoughness: 0.62,
          sheenColor: new THREE.Color('#3d2a1e'),
          envMapIntensity: 0.4,
          side: THREE.DoubleSide
        });
      }
      const capMat = makeHairMaterial(false, 1, 1);
      const stripMat = makeHairMaterial(false, 0.07, 1);
      const tubeMat = makeHairMaterial(true, 0.12, 2);

      // ---- Quadro do rosto preso ao osso Head (osso: X = frente, Y = cima, Z = direita dela; escala 0.01) ----
      const head = bones.Head;
      head.updateWorldMatrix(true, false);
      const headScale = head.matrixWorld.getMaxScaleOnAxis();
      const eyeMidWorld = new V3();
      const tmpEye = new V3();
      bones.LeftEye.getWorldPosition(eyeMidWorld);
      bones.RightEye.getWorldPosition(tmpEye);
      eyeMidWorld.add(tmpEye).multiplyScalar(0.5);
      const hairFrame = new THREE.Group();
      hairFrame.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(new V3(0, 0, -1), new V3(0, 1, 0), new V3(1, 0, 0)));
      hairFrame.scale.setScalar(1 / headScale);
      hairFrame.position.copy(head.worldToLocal(eyeMidWorld));
      head.add(hairFrame);
      hairFrame.updateWorldMatrix(true, true);
      npcRig.hairFrame = hairFrame;

      // ---- Crânio medido no modelo: superelipsoide (expoente 2.4) ----
      const E = 2.4;
      const P = 2 / E;
      const skin = { cy: 0.004, cz: -0.083, rx: 0.082, ry: 0.090, rz: 0.108 };
      const skinZ = (x, y) => {
        const k = 1 - Math.pow(Math.abs(x) / skin.rx, E) - Math.pow(Math.abs(y - skin.cy) / skin.ry, E);
        return skin.cz + skin.rz * Math.pow(Math.max(k, 0), 1 / E);
      };
      const skinNormal = (p) => new V3(
        Math.sign(p.x) * Math.pow(Math.abs(p.x) / skin.rx, E - 1) / skin.rx,
        Math.sign(p.y - skin.cy) * Math.pow(Math.abs(p.y - skin.cy) / skin.ry, E - 1) / skin.ry,
        Math.sign(p.z - skin.cz) * Math.pow(Math.abs(p.z - skin.cz) / skin.rz, E - 1) / skin.rz
      ).normalize();
      const smooth = (t) => t * t * (3 - 2 * t);

      // Ponto do boné: az = azimute (0 = frente, +π/2 = esquerda dela), th = ângulo a partir do topo, rad = raios
      function capPoint(az, th, rad, front, back = 0) {
        const s = Math.sin(th), c = Math.cos(th);
        const r = Math.pow(Math.max(s, 0), P);
        const yy = Math.sign(c) * Math.pow(Math.abs(c), P);
        return new V3(
          rad[0] * r * Math.sin(az),
          skin.cy + rad[1] * yy,
          skin.cz + rad[2] * r * Math.cos(az) + front * Math.max(0, Math.cos(az)) * s - back * Math.pow(Math.max(0, -Math.cos(az)), 0.7) * s
        );
      }
      // Altura da borda do cabelo (linha da testa, acima da orelha, atrás da orelha até a nuca) por azimute 0..π
      const RIM = [[0, 0.062], [0.40, 0.062], [0.75, 0.040], [1.10, 0.008], [1.45, -0.016], [1.70, -0.022], [1.95, -0.034], [2.30, -0.068], [2.80, -0.088], [Math.PI, -0.092]];
      function rimY(az) {
        const a = Math.min(Math.PI, Math.abs(((az + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI));
        for (let i = 1; i < RIM.length; i++) {
          if (a <= RIM[i][0]) {
            const k = smooth((a - RIM[i - 1][0]) / (RIM[i][0] - RIM[i - 1][0]));
            return RIM[i - 1][1] + (RIM[i][1] - RIM[i - 1][1]) * k;
          }
        }
        return RIM[RIM.length - 1][1];
      }

      // Gera uma malha em grade (nu x nv) e vira os triângulos para a normal apontar para fora do centro dado
      function gridGeometry(nu, nv, pointFn, uvFn, center) {
        const pos = [], uv = [], idx = [];
        for (let j = 0; j <= nv; j++) {
          for (let i = 0; i <= nu; i++) {
            const p = pointFn(i / nu, j / nv);
            pos.push(p.x, p.y, p.z);
            const t = uvFn(i / nu, j / nv);
            uv.push(t[0], t[1]);
          }
        }
        const st = nu + 1;
        for (let j = 0; j < nv; j++) {
          for (let i = 0; i < nu; i++) {
            const a = j * st + i, b = a + 1, c = a + st, d = c + 1;
            idx.push(a, c, b, b, c, d);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setIndex(idx);
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
        geo.computeVertexNormals();
        if (center) {
          const n = geo.attributes.normal, p = geo.attributes.position;
          let dot = 0;
          for (let k = 0; k < p.count; k += 7) {
            dot += n.getX(k) * (p.getX(k) - center.x) + n.getY(k) * (p.getY(k) - center.y) + n.getZ(k) * (p.getZ(k) - center.z);
          }
          if (dot < 0) {
            const ix = geo.index.array;
            for (let k = 0; k < ix.length; k += 3) { const t = ix[k + 1]; ix[k + 1] = ix[k + 2]; ix[k + 2] = t; }
            geo.index.needsUpdate = true;
            geo.computeVertexNormals();
          }
        }
        return geo;
      }

      // ---- 1. BONÉ DE CABELO: liso, penteado para trás, sem risca; afina até encostar na pele na borda ----
      const capRad = [skin.rx + 0.0065, skin.ry + 0.0065, skin.rz + 0.0065];
      const skinRad = [skin.rx - 0.0012, skin.ry - 0.0012, skin.rz - 0.0012];
      const capRows = 26;
      const lipRows = 3;
      const capGeo = gridGeometry(
        96, capRows + lipRows,
        (u, v) => {
          const az = u * Math.PI * 2;
          const thRim = Math.acos(THREE.MathUtils.clamp(Math.pow(Math.abs((rimY(az) - skin.cy) / skin.ry), E / 2) * Math.sign(rimY(az) - skin.cy), -1, 1));
          const row = v * (capRows + lipRows);
          if (row <= capRows) return capPoint(az, thRim * (row / capRows), capRad, 0.005, 0.016);
          const k = (row - capRows) / lipRows;
          const rad = capRad.map((r, n) => r + (skinRad[n] - r) * k);
          return capPoint(az, thRim + k * 0.07, rad, 0.005 * (1 - k), 0.016 - 0.008 * k);
        },
        (u, v) => [u * 2, v * 1.1],
        new V3(0, skin.cy, skin.cz)
      );
      const capMesh = new THREE.Mesh(capGeo, capMat);
      capMesh.castShadow = true;
      capMesh.receiveShadow = true;
      hairFrame.add(capMesh);

      // ---- 1b. CABELO DA NUCA: mecha lisa que cai por trás da cabeça e junta nas tranças (cobre a nuca) ----
      {
        const y0 = -0.040;
        const c0 = Math.pow(Math.abs((y0 - skin.cy) / skin.ry), E / 2) * Math.sign(y0 - skin.cy);
        const th0 = Math.acos(THREE.MathUtils.clamp(c0, -1, 1));
        const AZ = 1.52;
        const napeGeo = gridGeometry(40, 16,
          (u, v) => {
            const az = Math.PI - AZ + u * AZ * 2;
            const side = Math.cos((u * 2 - 1) * Math.PI / 2);   // 1 no meio, 0 nas pontas
            const top = capPoint(az, th0, capRad, 0, 0.018);
            const len = 0.105 + 0.055 * side;
            const t = v;
            const x = top.x * (1 - 0.30 * t);
            const y = y0 - len * t;
            const zIn = (top.z - skin.cz) * (1 - 0.30 * t) + skin.cz;
            const z = zIn - 0.010 * Math.sin(Math.PI * t) * side;
            return new V3(x, y, z);
          },
          (u, v) => [u * 0.9, v * 0.8],
          new V3(0, -0.06, skin.cz)
        );
        const napeMesh = new THREE.Mesh(napeGeo, stripMat);
        napeMesh.castShadow = true;
        napeMesh.receiveShadow = true;
        hairFrame.add(napeMesh);
      }

      // Fita achatada: centro (pts), normal da superfície (nrm), largura por ponto (wid)
      function flatRibbon(pts, nrm, wid) {
        const pos = [], uv = [], idx = [];
        const n = pts.length;
        for (let k = 0; k < n; k++) {
          const t = (k < n - 1 ? pts[k + 1].clone().sub(pts[k]) : pts[k].clone().sub(pts[k - 1])).normalize();
          const w = new V3().crossVectors(t, nrm[k]).normalize().multiplyScalar(wid[k] * 0.5);
          const a = pts[k].clone().add(w), b = pts[k].clone().sub(w);
          pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
          uv.push(0, k / (n - 1) * 2, 1, k / (n - 1) * 2);
          if (k < n - 1) { const i0 = k * 2; idx.push(i0, i0 + 1, i0 + 2, i0 + 1, i0 + 3, i0 + 2); }
        }
        const geo = new THREE.BufferGeometry();
        geo.setIndex(idx);
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
        geo.computeVertexNormals();
        return geo;
      }

      // ---- 2. FRANJA RETA E CHEIA: 15 fitas lisas lado a lado, terminam logo acima das sobrancelhas ----
      const BANG_N = 15;
      npcRig.bangPivots = [];
      for (let i = 0; i < BANG_N; i++) {
        const f = i / (BANG_N - 1) * 2 - 1;
        const x0 = f * 0.060;
        const yEnd = 0.039 + 0.008 * Math.pow(Math.abs(f), 2.0);
        const clr = 0.0042 + ((i * 5) % 3) * 0.0011;
        const K = 9;
        const pts = [], nrm = [], wid = [];
        for (let k = 0; k <= K; k++) {
          const u = k / K;
          const y = 0.084 + (yEnd - 0.084) * u;
          const x = x0 * (1 + 0.035 * u);
          const z = skinZ(x, y) + clr + 0.0055 * u * u;
          pts.push(new V3(x, y, z));
          nrm.push(new V3(0, 0.35 * u, 1).normalize());
          wid.push(0.0165 - 0.0030 * u);
        }
        // pivô no topo da franja: o vento levanta as pontas de leve
        const pivotPos = new V3(0, 0.084, skinZ(0, 0.084));
        const bangPivot = new THREE.Group();
        bangPivot.position.copy(pivotPos);
        const m = new THREE.Mesh(flatRibbon(pts, nrm, wid), stripMat);
        m.position.copy(pivotPos).negate();
        m.castShadow = true;
        bangPivot.add(m);
        hairFrame.add(bangPivot);
        npcRig.bangPivots.push({ node: bangPivot, ph: i });
      }

      // ---- 4. BRINCOS: argola dourada fina com uma pérola, presos no lóbulo ----
      const goldMat = new THREE.MeshStandardMaterial({ color: '#e0b765', roughness: 0.22, metalness: 1.0, envMapIntensity: 1.3 });
      const pearlMat = new THREE.MeshStandardMaterial({ color: '#f4ece0', roughness: 0.28, metalness: 0.0, envMapIntensity: 0.9 });
      for (const s of [-1, 1]) {
        const earring = new THREE.Group();
        earring.position.set(s * 0.0895, -0.060, -0.084);
        const stud = new THREE.Mesh(new THREE.SphereGeometry(0.0036, 14, 10), goldMat);
        const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.0150, 0.0019, 10, 40), goldMat);
        hoop.rotation.y = Math.PI / 2;
        hoop.position.set(s * 0.0022, -0.0150, 0);
        const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.0050, 16, 12), pearlMat);
        pearl.position.set(s * 0.0022, -0.0300, 0);
        earring.add(stud, hoop, pearl);
        hairFrame.add(earring);
      }

      // ---- 5. TRANÇAS: raiz na nuca (no cabelo), desce pelo lado do pescoço, pela frente do ombro, até perto da cintura ----
      const neck = bones.Neck;
      neck.updateWorldMatrix(true, false);
      const holder = new THREE.Group();
      holder.matrixAutoUpdate = false;
      holder.matrix.copy(neck.matrixWorld).invert().multiply(avatarRoot.matrixWorld);
      neck.add(holder);
      holder.matrixWorldNeedsUpdate = true;
      npcRig.braidPivots = [];

      const toRoot = (p) => avatarRoot.worldToLocal(hairFrame.localToWorld(p.clone()));
      const armJoint = { 1: new V3(), '-1': new V3() };
      bones.LeftArm.getWorldPosition(armJoint[1]);
      bones.RightArm.getWorldPosition(armJoint['-1']);
      avatarRoot.worldToLocal(armJoint[1]);
      avatarRoot.worldToLocal(armJoint['-1']);

      for (const s of [-1, 1]) {
        const napeFrame = new V3(s * 0.056, -0.083, -0.128);
        const S = toRoot(napeFrame);
        const AJ = armJoint[s];
        const A = new V3(s * 0.094, AJ.y + 0.072, AJ.z + 0.046);
        // o feixe passa POR CIMA do ombro (para fora e para a frente da gola), não por dentro dele
        const mid = S.clone().lerp(A, 0.5).add(new V3(s * 0.022, 0.010, 0.030));

        // feixe de cabelo liso da nuca até o ombro (preso ao pescoço)
        const bundleCurve = new THREE.CatmullRomCurve3([S, mid, A], false, 'centripetal');
        const bundle = new THREE.Mesh(new THREE.TubeGeometry(bundleCurve, 24, 0.0140, 10, false), tubeMat);
        bundle.castShadow = true;
        holder.add(bundle);

        // pivô no ombro: a trança balança só um pouco, em torno desse ponto
        const pivot = new THREE.Group();
        pivot.position.copy(A);
        holder.add(pivot);
        npcRig.braidPivots.push({ node: pivot, side: s });

        const rel = [
          new V3(0, 0, 0),
          new V3(s * 0.011, -0.105, 0.016),
          new V3(s * 0.016, -0.210, 0.026),
          new V3(s * 0.018, -0.315, 0.032),
          new V3(s * 0.017, -0.420, 0.034)
        ];
        const braidCurve = new THREE.CatmullRomCurve3(rel, false, 'centripetal');
        const SEG = 180;
        const frames = braidCurve.computeFrenetFrames(SEG, false);
        const TURNS = 10;
        for (let k = 0; k < 3; k++) {
          class StrandCurve extends THREE.Curve {
            getPoint(t, target = new V3()) {
              const base = braidCurve.getPointAt(t);
              const i = Math.min(SEG, Math.round(t * SEG));
              const ramp = 0.30 + 0.70 * smooth(Math.min(1, t / 0.12));
              const end = 1 - 0.55 * smooth(Math.max(0, (t - 0.84) / 0.16));
              const rr = 0.0092 * ramp * end;
              const ang = k * Math.PI * 2 / 3 + t * TURNS * Math.PI * 2;
              return target.copy(base)
                .addScaledVector(frames.normals[i], Math.cos(ang) * rr)
                .addScaledVector(frames.binormals[i], Math.sin(ang) * rr * 0.85);
            }
          }
          const tube = new THREE.Mesh(new THREE.TubeGeometry(new StrandCurve(), 220, 0.0108, 8, false), tubeMat);
          tube.castShadow = true;
          pivot.add(tube);
        }

        // elástico dourado e a pontinha solta da trança
        const endPt = braidCurve.getPointAt(1);
        const tan = braidCurve.getTangentAt(1);
        const tie = new THREE.Mesh(new THREE.TorusGeometry(0.0120, 0.0029, 10, 22), goldMat);
        tie.position.copy(braidCurve.getPointAt(0.975));
        tie.quaternion.setFromUnitVectors(new V3(0, 0, 1), tan);
        pivot.add(tie);
        for (let r = -1; r <= 1; r++) {
          const pts = [], nrm = [], wid = [];
          for (let k = 0; k <= 5; k++) {
            const u = k / 5;
            pts.push(endPt.clone().add(new V3(s * 0.002 + r * 0.004 * u, -0.004 - 0.040 * u, 0.0035 * u)));
            nrm.push(new V3(0, 0, 1));
            wid.push(0.0105 * (1 - 0.75 * u));
          }
          const m = new THREE.Mesh(flatRibbon(pts, nrm, wid), stripMat);
          pivot.add(m);
        }
      }
      npcRig.braidHolder = holder;
    }

    // ---- Esqueleto de braço: dois ossos + pólo do cotovelo; resolve no espaço do mundo ----
    const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
    function swingBone(bone, fromDir, toDir) {
      _q1.setFromUnitVectors(fromDir.clone().normalize(), toDir.clone().normalize());
      bone.getWorldQuaternion(_q2);
      bone.parent.getWorldQuaternion(_q3);
      bone.quaternion.copy(_q3.invert().multiply(_q1.multiply(_q2)));
      bone.updateMatrixWorld(true);
    }
    function spinBone(bone, axis, ang) {
      if (Math.abs(ang) < 1e-6) return;
      _q1.setFromAxisAngle(axis.clone().normalize(), ang);
      bone.getWorldQuaternion(_q2);
      bone.parent.getWorldQuaternion(_q3);
      bone.quaternion.copy(_q3.invert().multiply(_q1.multiply(_q2)));
      bone.updateMatrixWorld(true);
    }
    const wpos = (bone) => bone.getWorldPosition(new THREE.Vector3());

    function makeArm(bones, side) {
      const p = side > 0 ? 'Left' : 'Right';
      const arm = {
        side,
        upper: bones[p + 'Arm'], fore: bones[p + 'ForeArm'], hand: bones[p + 'Hand'],
        mid1: bones[p + 'HandMiddle1'], idx1: bones[p + 'HandIndex1'], pin1: bones[p + 'HandPinky1'],
        fingers: ['Index', 'Middle', 'Ring', 'Pinky'].map((f) => [1, 2, 3].map((j) => bones[`${p}Hand${f}${j}`])),
      };
      arm.L1 = wpos(arm.upper).distanceTo(wpos(arm.fore));
      arm.L2 = wpos(arm.fore).distanceTo(wpos(arm.hand));
      // Palma: normal = fingerDir x (indicador -> mindinho), com o sinal calibrado no T-pose (palma para baixo)
      const fd = wpos(arm.mid1).sub(wpos(arm.hand));
      const lat = wpos(arm.pin1).sub(wpos(arm.idx1));
      arm.palmSign = new THREE.Vector3().crossVectors(fd, lat).y > 0 ? -1 : 1;
      arm.curlSign = 1;
      {
        const f = fd.clone().normalize(), a = lat.clone().normalize();
        const n = new THREE.Vector3().crossVectors(fd, lat).multiplyScalar(arm.palmSign).normalize();
        arm.curlSign = new THREE.Vector3().crossVectors(a, f).dot(n) > 0 ? 1 : -1;
      }
      return arm;
    }
    function palmNormal(arm) {
      const fd = wpos(arm.mid1).sub(wpos(arm.hand));
      const lat = wpos(arm.pin1).sub(wpos(arm.idx1));
      return new THREE.Vector3().crossVectors(fd, lat).multiplyScalar(arm.palmSign).normalize();
    }

    // Leva o pulso até o alvo (dois ossos), vira a palma para baixo e deixa a mão deitada na superfície
    function solveArm(arm, target, pole, curl) {
      const A = wpos(arm.upper), B = wpos(arm.fore);
      const to = target.clone().sub(A);
      const d = THREE.MathUtils.clamp(to.length(), Math.abs(arm.L1 - arm.L2) + 1e-3, (arm.L1 + arm.L2) * 0.999);
      const dir = to.normalize();
      const cosA = (arm.L1 * arm.L1 + d * d - arm.L2 * arm.L2) / (2 * arm.L1 * d);
      const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
      const perp = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
      const Bn = A.clone().addScaledVector(dir, arm.L1 * cosA).addScaledVector(perp, arm.L1 * sinA);
      swingBone(arm.upper, B.clone().sub(A), Bn.clone().sub(A));
      const B2 = wpos(arm.fore), C = wpos(arm.hand);
      const Tn = A.clone().addScaledVector(dir, d);
      swingBone(arm.fore, C.clone().sub(B2), Tn.clone().sub(B2));

      // torção do antebraço: palma para baixo (com leve inclinação para dentro)
      const B3 = wpos(arm.fore), C3 = wpos(arm.hand);
      const axis = C3.clone().sub(B3).normalize();
      const down = new THREE.Vector3(0, -1, 0);
      const nPalm = palmNormal(arm);
      const np = nPalm.clone().sub(axis.clone().multiplyScalar(nPalm.dot(axis))).normalize();
      const dp = down.clone().sub(axis.clone().multiplyScalar(down.dot(axis))).normalize();
      const ang = Math.atan2(axis.dot(new THREE.Vector3().crossVectors(np, dp)), np.dot(dp));
      spinBone(arm.fore, axis, ang);

      // mão deitada: dedos na horizontal, levemente para baixo
      const h = wpos(arm.mid1).sub(wpos(arm.hand));
      const flat = new THREE.Vector3(h.x, 0, h.z);
      if (flat.lengthSq() < 1e-6) flat.set(axis.x, 0, axis.z);
      flat.normalize();
      flat.y = -0.06;
      swingBone(arm.hand, h, flat);

      // dedos relaxados, levemente curvados para a palma
      const latW = wpos(arm.pin1).sub(wpos(arm.idx1)).normalize();
      const base = [0.10, 0.15, 0.12, 0.10];
      arm.fingers.forEach((joints, fi) => {
        joints.forEach((jb, j) => {
          if (!jb) return;
          spinBone(jb, latW, arm.curlSign * (base[fi] + curl) * (j === 0 ? 0.8 : j === 1 ? 1.0 : 0.7));
        });
      });
    }

    // Pose de pé, apoiada no peitoril: pernas relaxadas aqui; a inclinação do tronco e a cabeça em finishNpcPose
    function poseNpcContemplating(avatarRoot, bones) {
      const X = new THREE.Vector3(1, 0, 0);
      const Y = new THREE.Vector3(0, 1, 0);
      const Z = new THREE.Vector3(0, 0, 1);
      const deg = THREE.MathUtils.degToRad;

      // Braços calibrados no T-pose do modelo, antes de qualquer giro
      npcRig.arms = [makeArm(bones, 1), makeArm(bones, -1)];

      // Em pé, peso levemente mais numa perna (contrapposto), joelhos macios
      rotateBoneInModelSpace(bones.Hips, Z, deg(-1.4), avatarRoot);
      rotateBoneInModelSpace(bones.LeftUpLeg, Z, deg(2.0), avatarRoot);
      rotateBoneInModelSpace(bones.LeftUpLeg, X, deg(1.5), avatarRoot);
      rotateBoneInModelSpace(bones.LeftLeg, X, deg(2.5), avatarRoot);
      rotateBoneInModelSpace(bones.RightUpLeg, Z, deg(-3.0), avatarRoot);
      rotateBoneInModelSpace(bones.RightUpLeg, X, deg(-4), avatarRoot);
      rotateBoneInModelSpace(bones.RightUpLeg, Y, deg(-5), avatarRoot);
      rotateBoneInModelSpace(bones.RightLeg, X, deg(8), avatarRoot);
      rotateBoneInModelSpace(bones.RightFoot, X, deg(-4), avatarRoot);
    }

    // Peitoril da janela (topo) e onde as mãos pousam
    const SILL_TOP_Y = 0.814;
    const HAND_REST_Y = SILL_TOP_Y + 0.031;
    const HAND_REST_Z = -3.19;

    function finishNpcPose(avatarRoot, bones) {
      const X = new THREE.Vector3(1, 0, 0);
      const Y = new THREE.Vector3(0, 1, 0);
      const Z = new THREE.Vector3(0, 0, 1);
      const deg = THREE.MathUtils.degToRad;
      const [armL, armR] = npcRig.arms;
      avatarRoot.updateMatrixWorld(true);

      // Tronco inclinado para a frente até as mãos alcançarem o peitoril com o cotovelo um pouco dobrado
      const spineNames = ['Spine', 'Spine1', 'Spine2'];
      const share = [0.36, 0.34, 0.30];
      const rest = {};
      for (const n of spineNames) rest[n] = bones[n].quaternion.clone();
      let alpha = 26;
      for (; alpha <= 54; alpha += 2) {
        for (const n of spineNames) { bones[n].quaternion.copy(rest[n]); bones[n].updateMatrixWorld(true); }
        spineNames.forEach((n, i) => rotateBoneInModelSpace(bones[n], X, deg(alpha * share[i]), avatarRoot));
        const ok = [armL, armR].every((a) => {
          const s = wpos(a.upper);
          return s.distanceTo(new THREE.Vector3(s.x, HAND_REST_Y, HAND_REST_Z)) <= (a.L1 + a.L2) * 0.965;
        });
        if (ok) break;
      }
      npcRig.leanDeg = alpha;
      // leve torção do tronco para o lado do pôr do sol (direita dela)
      spineNames.forEach((n) => rotateBoneInModelSpace(bones[n], Y, deg(-3), avatarRoot));

      // Cabeça levantada (olhar um pouco abaixo do horizonte) e virada para o mar/pôr do sol, sem rigidez
      const pitch = deg(4) - deg(alpha);
      rotateBoneInModelSpace(bones.Neck, X, pitch * 0.42, avatarRoot);
      rotateBoneInModelSpace(bones.Head, X, pitch * 0.58, avatarRoot);
      rotateBoneInModelSpace(bones.Neck, Y, deg(-20), avatarRoot);
      rotateBoneInModelSpace(bones.Head, Y, deg(-33), avatarRoot);
      rotateBoneInModelSpace(bones.Head, Z, deg(2.5), avatarRoot);
      rotateBoneInModelSpace(bones.LeftShoulder, Z, deg(-3), avatarRoot);
      rotateBoneInModelSpace(bones.RightShoulder, Z, deg(3), avatarRoot);
      avatarRoot.updateMatrixWorld(true);

      // Alvos das mãos (mundo) em cima do peitoril, um pouco mais juntos que os ombros
      const sL = wpos(armL.upper), sR = wpos(armR.upper);
      const cx = (sL.x + sR.x) * 0.5;
      npcRig.armTargets = [
        new THREE.Vector3(sL.x + (cx - sL.x) * 0.22, HAND_REST_Y, HAND_REST_Z),
        new THREE.Vector3(sR.x + (cx - sR.x) * 0.22, HAND_REST_Y, HAND_REST_Z)
      ];
      // Cotovelos para fora e um pouco para trás (no espaço da personagem)
      const rootQ = new THREE.Quaternion();
      avatarRoot.getWorldQuaternion(rootQ);
      npcRig.armPoles = [
        new THREE.Vector3(0.8, -0.25, -0.55).applyQuaternion(rootQ).normalize(),
        new THREE.Vector3(-0.8, -0.25, -0.55).applyQuaternion(rootQ).normalize()
      ];

      // Poses-base que o loop de animação restaura a cada quadro
      const animated = ['Spine', 'Spine1', 'Spine2', 'Neck', 'Head', 'LeftShoulder', 'RightShoulder'];
      for (const k of Object.keys(bones)) {
        if (/^(Left|Right)(Arm|ForeArm|Hand|Hand(Index|Middle|Ring|Pinky|Thumb)[123])$/.test(k)) animated.push(k);
      }
      npcRig.animBones = animated.filter((k) => bones[k]);
      for (const k of npcRig.animBones) npcRig.baseQuats[k] = bones[k].quaternion.clone();
      npcRig.armCurl = [0, 0];
      solveNpcArms(0);
    }

    // ---- Diretor de gestos: um movimento pequeno por vez, depois uma pausa; nada de ir-e-voltar em ciclo ----
    // Cada canal anda suavemente do valor atual até um alvo novo e FICA lá até o próximo gesto sortear outro.
    const gestureCh = {};
    const gestureDir = { next: 3.0, last: '', queue: [] };
    for (const k of ['headYaw', 'headPitch', 'lean', 'hipRoll', 'smile', 'lx', 'lz', 'ly', 'rx', 'rz', 'ry']) {
      gestureCh[k] = { v: 0, from: 0, to: 0, t0: 0, dur: 1 };
    }
    const smoother = (u) => { u = Math.min(1, Math.max(0, u)); return u * u * u * (u * (u * 6 - 15) + 10); };
    function moveCh(name, to, t, dur) {
      const c = gestureCh[name];
      c.from = c.v; c.to = to; c.t0 = t; c.dur = dur;
    }
    const rnd = (a, b) => a + Math.random() * (b - a);
    function runGestureDirector(t) {
      for (const k in gestureCh) {
        const c = gestureCh[k];
        c.v = c.from + (c.to - c.from) * smoother((t - c.t0) / c.dur);
      }
      if (t < gestureDir.next) return;
      // gesto em duas partes (ex.: mão levanta e depois pousa em outro ponto)
      if (gestureDir.queue.length) {
        const step = gestureDir.queue.shift();
        step(t);
        return;
      }
      const options = ['olharMar', 'olharPor', 'olharBaixo', 'peso', 'maoD', 'maoE', 'sorriso', 'respirar'].filter((o) => o !== gestureDir.last);
      const pick = options[Math.floor(Math.random() * options.length)];
      gestureDir.last = pick;
      let busy = 0;
      if (pick === 'olharMar') { moveCh('headYaw', rnd(0.20, 0.38), t, rnd(2.0, 3.2)); moveCh('headPitch', rnd(0.0, 0.04), t, 2.4); busy = 3.2; }
      else if (pick === 'olharPor') { moveCh('headYaw', rnd(-0.10, 0.06), t, rnd(2.0, 3.0)); moveCh('headPitch', rnd(-0.01, 0.03), t, 2.4); busy = 3.0; }
      else if (pick === 'olharBaixo') { moveCh('headPitch', rnd(-0.07, -0.03), t, 1.8); moveCh('headYaw', gestureCh.headYaw.v + rnd(-0.05, 0.05), t, 1.8); busy = 1.8; }
      else if (pick === 'peso') { moveCh('hipRoll', rnd(-0.025, 0.025), t, rnd(2.2, 3.4)); moveCh('lean', rnd(-0.04, 0.03), t, 2.8); busy = 3.4; }
      else if (pick === 'sorriso') { moveCh('smile', rnd(0.05, 0.32), t, rnd(1.2, 2.0)); busy = 2.0; }
      else if (pick === 'respirar') { moveCh('lean', gestureCh.lean.v - 0.03, t, 1.6); busy = 1.6; gestureDir.queue.push((t2) => { moveCh('lean', gestureCh.lean.v + 0.03, t2, 2.0); gestureDir.next = t2 + 2.4; }); }
      else if (pick === 'maoD') {
        // levanta um pouco os dedos/mão direita, e depois pousa em outro ponto do peitoril
        moveCh('ry', 0.034, t, 1.2); moveCh('rx', gestureCh.rx.v + rnd(-0.02, 0.02), t, 1.2); busy = 1.3;
        const nx = rnd(-0.035, 0.035), nz = rnd(-0.02, 0.03);
        gestureDir.queue.push((t2) => { moveCh('rx', nx, t2, 1.4); moveCh('rz', nz, t2, 1.4); moveCh('ry', 0, t2, 1.6); gestureDir.next = t2 + 1.8; });
      } else if (pick === 'maoE') {
        moveCh('ly', 0.03, t, 1.2); busy = 1.3;
        const nx = rnd(-0.035, 0.035), nz = rnd(-0.02, 0.03);
        gestureDir.queue.push((t2) => { moveCh('lx', nx, t2, 1.4); moveCh('lz', nz, t2, 1.4); moveCh('ly', 0, t2, 1.6); gestureDir.next = t2 + 1.8; });
      }
      // pausa antes do próximo gesto: ela fica parada, só respirando e com o vento mexendo o cabelo
      gestureDir.next = t + busy + rnd(2.2, 5.5);
    }

    // Vento suave e irregular (soma de ondas lentas fora de fase), 0..1
    function windGust(t) {
      const w = 0.55 * Math.sin(t * 0.37 + 1.1) + 0.30 * Math.sin(t * 0.91 + 0.4) + 0.15 * Math.sin(t * 1.73 + 2.2);
      const g = 0.5 + 0.5 * w;
      return g * g * (3 - 2 * g);
    }

    function solveNpcArms() {
      const arms = npcRig.arms;
      if (!arms || !npcRig.armTargets) return;
      const c = gestureCh;
      const tl = npcRig.armTargets[0].clone();
      tl.x += c.lx.v; tl.z += c.lz.v; tl.y += c.ly.v;
      const tr = npcRig.armTargets[1].clone();
      tr.x += c.rx.v; tr.z += c.rz.v; tr.y += c.ry.v;
      // dedos relaxam um pouco mais quando a mão está no ar
      solveArm(arms[0], tl, npcRig.armPoles[0], c.ly.v * 6.0);
      solveArm(arms[1], tr, npcRig.armPoles[1], c.ry.v * 6.0);

          avatar.traverse((obj) => {
            if (obj.isBone) {
              npcRig.bones[obj.name] = obj;
            }
            if (obj.isMesh) {
              if (obj.name === 'H_DDS_HighRes') npcRig.faceMesh = obj;
              if (obj.name === 'h_wig') {
                obj.visible = false;
                return;
              }
              obj.castShadow = true;
              obj.receiveShadow = true;
              obj.frustumCulled = false;

              const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
              for (const m of mats) {
                if (!m) continue;
                if (obj.name === 'H_DDS_HighRes' && m.map && m.map.image && !npcRig.swayU) {
                  addDressSway(obj, m, m.map.image);
                }
                if (m.map && m.map.image) {
                  if (!customAtlasTex) {
                    customAtlasTex = customizeGirlfriendAtlas(m.map.image, maxAniso);
                  }
                  m.map = customAtlasTex;

                if (m.normalMap) {
                  m.normalMap.anisotropy = maxAniso;
                  m.normalScale = new THREE.Vector2(0.75, 0.75);
                }
                // Pele e tecido de linho/algodão com resposta física natural estilo GTA V (sem aspecto plástico/gelado)
                m.roughness = 0.64;
                m.metalness = 0.02;
                m.envMapIntensity = 0.90;
                m.needsUpdate = true;
              }
            }
          });

          poseNpcContemplating(avatar, npcRig.bones);

          // Calibrar altura exata para que os pés toquem perfeitamente o piso (y = 0)
          avatar.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(avatar);
          if (isFinite(box.min.y)) {
            avatar.position.y -= box.min.y;
            avatar.updateMatrixWorld(true);
          }

          // Tronco inclinado, cabeça virada para o mar e mãos no peitoril (com os pés já no chão)

          // Cabelo natural, brincos e tranças nas coordenadas exatas pós-pose
          attachGirlfriendBraidsAndDress(avatar, npcRig.bones, maxAniso);

          npcRig.loaded = true;
          resolve(true);
        },
        undefined,
        (err) => {
          console.warn('Falha ao carregar avatar GLB:', err);
          resolve(false);
        }

    function updateNpcAnimation(t) {
      if (!npcRig.loaded || !npcRig.root) return;
      const b = npcRig.bones;
      const q = npcRig.baseQuats;
      const X = new THREE.Vector3(1, 0, 0);
      const Y = new THREE.Vector3(0, 1, 0);
      const Z = new THREE.Vector3(0, 0, 1);
      const root = npcRig.root;

      // Volta à pose-base e aplica só movimentos pequenos
      for (const key of npcRig.animBones) {
        if (b[key] && q[key]) b[key].quaternion.copy(q[key]);
      }
      root.updateMatrixWorld(true);

      runGestureDirector(t);
      const gc = gestureCh;
      const gust = windGust(t);
      const breath = Math.sin(t * 1.25);

      // Respiração (contínua e bem discreta) + o que o gesto da vez pediu
      rotateBoneInModelSpace(b.Spine, Z, gc.hipRoll.v, root);
      rotateBoneInModelSpace(b.Spine, X, gc.lean.v * 0.4, root);
      rotateBoneInModelSpace(b.Spine1, X, gc.lean.v * 0.35 - breath * 0.006, root);
      rotateBoneInModelSpace(b.Spine2, X, gc.lean.v * 0.25 - breath * 0.008, root);
      rotateBoneInModelSpace(b.LeftShoulder, Z, breath * 0.005, root);
      rotateBoneInModelSpace(b.RightShoulder, Z, -breath * 0.005, root);
      rotateBoneInModelSpace(b.Neck, Y, gc.headYaw.v * 0.42, root);
      rotateBoneInModelSpace(b.Head, Y, gc.headYaw.v * 0.58, root);
      rotateBoneInModelSpace(b.Neck, X, gc.headPitch.v * 0.4, root);
      rotateBoneInModelSpace(b.Head, X, gc.headPitch.v * 0.6, root);
      rotateBoneInModelSpace(b.Head, Z, gc.hipRoll.v * 0.8, root);

      // Mãos presas ao peitril (o tronco respira, as mãos ficam no lugar)
      solveNpcArms();

      // Vento: tranças e franja balançam suave, o vestido ondula na barra
      if (npcRig.braidPivots) {
        for (const bp of npcRig.braidPivots) {
          bp.node.rotation.x = 0.045 + 0.11 * gust + Math.sin(t * 0.8 + bp.side) * 0.012;
          bp.node.rotation.z = bp.side * (0.015 + 0.05 * gust) + Math.sin(t * 0.6 + bp.side * 2.0) * 0.010;
        }
      }
      if (npcRig.bangPivots) {
        for (const bp of npcRig.bangPivots) {
          bp.node.rotation.x = -(0.012 + 0.07 * gust * (0.75 + 0.25 * Math.sin(bp.ph * 1.7 + t * 0.9)));
          bp.node.rotation.z = Math.sin(bp.ph * 2.3 + t * 0.7) * 0.012 * gust;
        }
      }
      if (npcRig.swayU) {
        npcRig.swayU.uSwayTime.value = t;
        npcRig.swayU.uWind.value = gust;
      }

      // Piscar em intervalos irregulares e sorriso discreto
      const fm = npcRig.faceMesh;
      if (fm && fm.morphTargetInfluences && fm.morphTargetDictionary) {
        const d = fm.morphTargetDictionary;
        const bl = npcRig.blink || (npcRig.blink = { next: 2.0, t0: -9 });
        if (t >= bl.next) { bl.t0 = t; bl.next = t + 2.4 + Math.random() * 4.2; }
        const u = (t - bl.t0) / 0.17;
        const blink = u >= 0 && u < 1 ? Math.sin(Math.PI * u) : 0;
        const set = (name, v) => { const i = d['h_expressions.' + name]; if (i !== undefined) fm.morphTargetInfluences[i] = v; };
        set('ReyeClose_h', blink);
        set('LeyeClose_h', blink);
        const smile = 0.16 + gc.smile.v;
        set('RsmileClose_h', smile);
        set('LsmileClose_h', smile);
        // sobrancelhas relaxadas (sem franzir)
        set('RbrowUp_h', 0.30);
        set('LbrowUp_h', 0.30);
      }

        // Micro-vinco natural no centro
        y += Math.sin(nx * 5.0 + nz * 4.0) * 0.004 * (1.0 - Math.abs(nx));
        p.setXYZ(i, x, y, z);

    // Geometria de folha 3D arqueada com nervura central em V e bordas levemente onduladas
    function createCurvedLeafGeometry() {
      const segU = 10, segV = 14;
      const geo = new THREE.PlaneGeometry(0.22, 0.34, segU, segV);
      geo.translate(0, 0.17, 0); // pivô na base do pecíolo
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x0 = p.getX(i); // -0.11 .. 0.11
        const y0 = p.getY(i); // 0 .. 0.34
        const u = Math.max(-1, Math.min(1, x0 / 0.11));  // -1 .. 1
        const v = Math.max(0.0001, Math.min(1, y0 / 0.34)); // clamp > 0 evita Math.pow(negativo) -> NaN!

        // Silhueta orgânica de Ficus Lyrata (estreita na base, larga no topo, ponta delicada)
        const silhouette = Math.sin(Math.pow(v, 0.72) * Math.PI) * (0.76 + 0.32 * Math.sin(v * Math.PI * 1.4));
        const x = x0 * silhouette;
        // Curvatura arqueada graciosa para baixo + calha em V na nervura + leve ondulação de borda
        const archZ = Math.pow(v, 1.85) * 0.085;
        const vFold = -Math.abs(u) * 0.018 * silhouette;
        const ruffle = Math.sin(v * 14.0) * 0.005 * Math.abs(u) * silhouette;
        const y = y0 * (1.0 - v * 0.12);
        p.setXYZ(i, x, y, archZ + vFold + ruffle);
      }
      geo.computeVertexNormals();
      return geo;
    }

        varying vec2 vUv;
        void main() {
          vUv = uv;

        }
      `,
      fragmentShader: /* glsl */`
        uniform vec3 uColor;
        uniform float uOpacity;
        varying vec2 vUv;
        void main() {
          float edgeX = smoothstep(0.0, 0.32, vUv.x) * smoothstep(1.0, 0.68, vUv.x);
          float fadeLen = smoothstep(0.0, 0.16, vUv.y) * smoothstep(1.0, 0.08, vUv.y);

    function applySunsetMood(sliderValue) {
      const t = sliderValue / 100;
      sunState.elevationDeg = THREE.MathUtils.lerp(2.0, 14.0, t);
      sunState.dir.copy(computeSunDir(sunState.elevationDeg, sunState.azimuthDeg));

      // Paleta fotográfica de golden hour / crepúsculo (mais contraste azul x dourado!)
      const zenith  = new THREE.Color('#0f1a36').lerp(new THREE.Color('#1f4276'), t);
      const midSky  = new THREE.Color('#5a3958').lerp(new THREE.Color('#9c7784'), t);
      const horizon = new THREE.Color('#df6a3f').lerp(new THREE.Color('#f0b177'), t);
      const sunCol  = new THREE.Color('#ff8142').lerp(new THREE.Color('#ffd094'), t);

      skyUniforms.uSunDir.value.copy(sunState.dir);
      skyUniforms.uZenithColor.value.copy(zenith);
      skyUniforms.uMidSkyColor.value.copy(midSky);
      skyUniforms.uHorizonColor.value.copy(horizon);

      oceanUniforms.uSunDir.value.copy(sunState.dir);
      oceanUniforms.uHorizonColor.value.copy(horizon);
      oceanUniforms.uMidSkyColor.value.copy(midSky);
      oceanUniforms.uSunColor.value.copy(sunCol);
      oceanUniforms.uSkyColor.value.copy(zenith).lerp(midSky, 0.35);

      mountainUniforms.uSunDir.value.copy(sunState.dir);
      mountainUniforms.uSunColor.value.copy(sunCol);
      mountainUniforms.uHorizonColor.value.copy(horizon);

      sunLight.position.copy(sunState.dir).multiplyScalar(12.0).add(new THREE.Vector3(0, 0.8, -1.6));
      sunLight.color.copy(sunCol);
      sunLight.intensity = THREE.MathUtils.lerp(1.90, 3.35, t);

      windowAreaLight.color.copy(horizon).lerp(sunCol, 0.35);
      windowAreaLight.intensity = THREE.MathUtils.lerp(1.55, 2.75, t);

      windowBounce.color.copy(horizon);
      windowBounce.intensity = THREE.MathUtils.lerp(1.10, 1.85, t);
      hemiLight.intensity = THREE.MathUtils.lerp(0.44, 0.70, t);

      const lampBoost = THREE.MathUtils.lerp(1.28, 0.76, t);
      tableLampLight.intensity = 1.35 * lampBoost;
      bedLampLight.intensity = 2.05 * lampBoost;
      shadeUniforms.uGlow.value = 1.02 * lampBoost;

      curtainUniforms.uBacklitColor.value.copy(sunCol);
      curtainUniforms.uBacklitStrength.value = THREE.MathUtils.lerp(0.32, 0.50, t);

      sunbeamMat.uniforms.uColor.value.copy(sunCol);
      sunbeamMat.uniforms.uOpacity.value = THREE.MathUtils.lerp(0.022, 0.042, t);
      steamUniforms.uTint.value.copy(new THREE.Color('#ffead2').lerp(sunCol, 0.25));
    }

      const p = CAMERA_PRESETS[name];

      document.querySelectorAll('.cam-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cam === name);

        camera.position.copy(p.pos);
        controls.target.copy(p.target);
        controls.update();
        camTransition = null;
        return;

      camTransition = {
        startPos: camera.position.clone(),
        endPos: p.pos.clone(),
        startTarget: controls.target.clone(),
        endTarget: p.target.clone(),
        progress: 0,
        duration: 1.15
      };

      envTimer = setTimeout(updateEnvironmentMap, 120);
    });

    window.__setCamera = (name) => goToPreset(name, true);
    window.__setCameraPos = (px, py, pz, tx, ty, tz) => {
      camera.position.set(px, py, pz);
      controls.target.set(tx, ty, tz);
      controls.update();
      camTransition = null;
    };
    window.__setSunset = (v) => {
      sunSlider.value = String(v);
      applySunsetMood(v);
      updateEnvironmentMap();
    };
    window.__hideUI = (hide) => {
      document.body.classList.toggle('ui-hidden', Boolean(hide));
    };

    function clampCameraInsideRoom() {
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, xWest + 0.25, xEast - 0.25);
      camera.position.y = THREE.MathUtils.clamp(camera.position.y, 0.28, H - 0.22);
      // Permite a câmera chegar até a varanda/janela (zNorth - 0.45) para girar 360° completos ao redor dela!
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, zNorth - 0.45, zSouth - 0.28);
    }

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.setSize(Math.floor(w * 0.5), Math.floor(h * 0.5));
    });

    // =========================================================================
    // 16. LOOP DE ANIMAÇÃO (BRISA, MAR, VAPOR, NUVENS, RESPIRAÇÃO)
    // =========================================================================
    let simTime = 0;
    let lastTime = performance.now();

    let perfFrames = 0, perfTime = -3;
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!isPaused) {
        simTime += dt;
        skyUniforms.uTime.value = simTime;
        oceanUniforms.uTime.value = simTime;
        steamUniforms.uTime.value = simTime;
        filmPass.uniforms.uTime.value = simTime;

        // Brisa suave nas cortinas
        for (const c of animatedCurtains) {
          const pos = c.geo.attributes.position;
          const base = c.basePositions;
          for (let i = 0; i < pos.count; i++) {
            const bx = base[i * 3];
            const by = base[i * 3 + 1];
            const bz = base[i * 3 + 2];
            const v = 1.0 - ((by / c.height) + 0.5);
            const sway = v * v;
            const waveZ = (Math.sin(simTime * 1.12 + bx * 2.2 + by * 1.3 + c.side) * 0.048 +
                           Math.cos(simTime * 0.68 + by * 1.9) * 0.022) * sway;
            const waveX = Math.sin(simTime * 0.82 + by * 1.6) * 0.018 * sway;
            pos.setXYZ(i, bx + waveX, by, bz + waveZ + sway * 0.042);
          }
          pos.needsUpdate = true;
        }

        // Respiração sutil e movimento contemplativo da personagem NPC
        updateNpcAnimation(simTime);

        // Micro-poeira flutuando lentamente no feixe de luz
        const dPos = dustGeo.attributes.position;
        for (let i = 0; i < dustCount; i++) {
          const s = dustSeeds[i];
          const py = dPos.getY(i) + Math.sin(simTime * 0.4 + s) * 0.00045;
          const px = dPos.getX(i) + Math.cos(simTime * 0.35 + s) * 0.00035;
          dPos.setXY(i, px, py);
        }
        dPos.needsUpdate = true;
      }

      if (camTransition) {
        camTransition.progress = Math.min(1, camTransition.progress + dt / camTransition.duration);
        const k = camTransition.progress;
        const ease = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, ease);
        controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, ease);
        if (camTransition.progress >= 1) camTransition = null;
      }

      controls.update();
      clampCameraInsideRoom();
      composer.render();
      // medidor de fluidez: a cada ~2 s, se ficou abaixo de 30 quadros/s, baixa a resolução um degrau
      perfFrames++; perfTime += dt;
      if (perfTime > 2) {
        const fps = perfFrames / perfTime;
        perfFrames = 0; perfTime = 0;
        if (false) {   // 20/11: tirado o modo leve (deixava pixelado)
          curRatio = Math.max(0.6, curRatio - 0.2);
          renderer.setPixelRatio(curRatio);
          composer.setPixelRatio(curRatio);
          composer.setSize(window.innerWidth, window.innerHeight);
          if (curRatio <= 0.8) renderer.shadowMap.type = THREE.PCFShadowMap;
        }
      }
    }

    const readyTimeout = new Promise((r) => setTimeout(r, 7000));
    Promise.race([npcLoadPromise, readyTimeout]).then(() => {
      const urlCam = new URLSearchParams(window.location.search).get('cam');
      if (urlCam && CAMERA_PRESETS[urlCam]) goToPreset(urlCam, true);
      requestAnimationFrame((t) => {
        animate(t);
        document.getElementById('loader').classList.add('hidden');
        window.__npcLoaded = npcRig.loaded;
        window.__npc = npcRig;
        window.__dbg = { THREE, scene, camera };
        window.__person = personGroup;
        window.__ready = true;
      });
    });
  </script>
</body>
</html>
